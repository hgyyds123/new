<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在</title>
    
    <!-- 引入字体与图标 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ================= 1. 浅色模式 ================= */
        :root {
            --bg-color: #F8F9FA;
            --surface: #FFFFFF;
            --surface-variant: #F0F4F9;
            --text-main: #1F1F1F;
            --text-sub: #444746;
            --outline-variant: #C4C7C5;
            
            --primary: #0b57d0;
            --on-primary: #FFFFFF;
            --primary-hover: #0842a0;
            
            --error: #B3261E;
        }

        /* ================= 2. 深色模式 ================= */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #131314;
                --surface: #1E1F20;
                --surface-variant: #282A2C;
                --text-main: #E3E3E3;
                --text-sub: #C4C7C5;
                --outline-variant: #444746;
                
                --primary: #A8C7FA;
                --on-primary: #062E6F;
                --primary-hover: #D3E3FD;
                
                --error: #F2B8B5;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background-color 0.3s, color 0.3s;
        }

        a { text-decoration: none; color: inherit; }

        /* Ripple 动效 */
        .m3-ripple { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; }
        .ripple-circle {
            position: absolute; border-radius: 50%; background-color: rgba(128, 128, 128, 0.2);
            transform: scale(0); animation: ripple-anim 0.3s cubic-bezier(0.2, 0, 0, 1); pointer-events: none;
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        /* ================= 404 卡片容器 ================= */
        .error-card {
            background-color: var(--surface);
            border-radius: 28px; /* MD3 Extra Large 形状 */
            padding: 64px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 8px 3px rgba(0,0,0,.08); /* Level 1 阴影 */
            transition: background-color 0.3s;
        }

        /* 巨大的 404 数字 */
        .error-code {
            font-size: 96px;
            font-weight: 700;
            color: var(--surface-variant);
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.02);
        }

        .error-title {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .error-desc {
            font-size: 16px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* 药丸形主按钮 */
        .btn-filled {
            background-color: var(--primary);
            color: var(--on-primary);
            height: 48px;
            padding: 0 32px;
            border-radius: 9999px;
            font-size: 15px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .btn-filled:hover { 
            background-color: var(--primary-hover); 
            box-shadow: 0 1px 3px rgba(0,0,0,.15); 
        }
    </style>
</head>
<body>

    <div class="error-card">
        <!-- 巨大的背景数字 -->
        <div class="error-code">404</div>
        
        <h1 class="error-title">页面不存在</h1>
        <p class="error-desc">页面不存在<br>不妨回首页看看？</p>
        
        <!-- 返回按钮 -->
        <a href="/" class="btn-filled m3-ripple">
            <span class="material-symbols-outlined" style="font-size: 20px;">home</span>
            返回首页
        </a>
    </div>

    <script>
        // 简单的波纹动效
        document.addEventListener('click', function(e) {
            const target = e.target.closest('.m3-ripple');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const circle = document.createElement('span');
            circle.classList.add('ripple-circle');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = size + 'px';
            circle.style.left = (x - size / 2) + 'px';
            circle.style.top = (y - size / 2) + 'px';
            // 如果是主按钮，波纹用白色
            if (target.classList.contains('btn-filled')) {
                circle.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
            }
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 300);
        });
    </script>
</body>
</html>
