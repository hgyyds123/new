<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>页面已迁移</title>
  <!-- 立即跳转，content="0" 表示 0 秒后跳 -->
  <meta http-equiv="refresh" content="0; url=https://b.com/new-page.html">
  <!-- 告诉搜索引擎这是临时跳转，并给出目标地址 -->
  <link rel="canonical" href="https://support.hg1.dpdns.org/privacy">
  <script>
    // 备用：如果 meta refresh 被某些浏览器/插件拦截，用 JS 兜底
    window.location.replace("https://b.com/new-page.html");
  </script>
</head>
<body>
  <p>页面已迁移，正在跳转……如果未自动跳转，请<a href="https://b.com/new-page.html">点此前往新页面</a>。</p>
</body>
</html>
