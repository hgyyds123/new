<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · hg1.dpdns.org</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 24px; color: #333; text-align: center; margin-bottom: 8px; }
        .sub { text-align: center; font-size: 13px; color: #999; margin-bottom: 28px; }

        input {
            width: 100%;
            padding: 13px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px;
            transition: border-color 0.25s;
        }

        input:focus { border-color: #667eea; }

        #totpInput {
            text-align: center;
            letter-spacing: 6px;
            font-size: 18px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 12px;
        }

        .btn:hover { background: #5568d3; }

        .btn.secondary {
            background: #f0f2f8;
            color: #666;
        }

        .switch {
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        .switch a { color: #667eea; cursor: pointer; text-decoration: none; }
        .switch a:hover { text-decoration: underline; }

        .msg {
            text-align: center;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 12px;
        }

        .msg.error { color: #e74c3c; }
        .msg.ok { color: #27ae60; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">登录</h1>
        <p class="sub" id="subtitle">输入用户名和密码</p>

        <input type="text" id="username" placeholder="用户名" autocomplete="off">
        <input type="password" id="password" placeholder="密码" autocomplete="off">
        <input type="text" id="totpInput" placeholder="000000" maxlength="6" autocomplete="off" style="display:none;">

        <div class="msg" id="msg"></div>

        <button class="btn" id="submitBtn">登录</button>
        <button class="btn secondary" id="backBtn" style="display:none;">返回上一步</button>

        <div class="switch" id="switchRow">
            <span id="switchText">还没有账号？</span>
            <a id="switchBtn">注册</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";
        const WASMER_URL = "https://hgai-61677.wasmer.app";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const totpInput = document.getElementById("totpInput");
        const submitBtn = document.getElementById("submitBtn");
        const backBtn = document.getElementById("backBtn");
        const msg = document.getElementById("msg");
        const title = document.getElementById("title");
        const subtitle = document.getElementById("subtitle");
        const switchText = document.getElementById("switchText");
        const switchBtn = document.getElementById("switchBtn");
        const switchRow = document.getElementById("switchRow");

        // 登录阶段：password 或 totp
        let stage = "password";
        // 临时保存，用于 totp 阶段重新登录
        let tempUsername = "";
        let tempPassword = "";
        let tempSecret = "";

        function setMode(login) {
            stage = "password";
            if (login) {
                title.textContent = "登录";
                subtitle.textContent = "输入用户名和密码";
                submitBtn.textContent = "登录";
                switchText.textContent = "还没有账号？";
                switchBtn.textContent = "注册";
                switchRow.style.display = "block";
            } else {
                title.textContent = "注册新账号";
                subtitle.textContent = "选一个用户名和密码";
                submitBtn.textContent = "注册";
                switchText.textContent = "已有账号？";
                switchBtn.textContent = "登录";
                switchRow.style.display = "block";
            }
            usernameInput.style.display = "block";
            passwordInput.style.display = "block";
            totpInput.style.display = "none";
            backBtn.style.display = "none";
            usernameInput.disabled = false;
            passwordInput.disabled = false;
            msg.textContent = "";
            msg.className = "msg";
        }

        switchBtn.addEventListener("click", () => {
            const isCurrentlyLogin = title.textContent === "登录";
            setMode(!isCurrentlyLogin);
        });

        submitBtn.addEventListener("click", async () => {
            if (title.textContent === "注册新账号") {
                await doRegister();
            } else if (stage === "password") {
                await doPasswordStage();
            } else {
                await doTotpStage();
            }
        });

        async function doPasswordStage() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                msg.textContent = "用户名和密码都不能为空";
                msg.className = "msg error";
                return;
            }

            const fakeEmail = `${username}@hgt.l.cd`;

            const { data, error } = await db.auth.signInWithPassword({
                email: fakeEmail,
                password: password
            });

            if (error) {
                msg.textContent = "用户名或密码错误";
                msg.className = "msg error";
                return;
            }

            // 检查是否开了 2FA
            const { data: profile } = await db
                .from("profiles")
                .select("totp_enabled")
                .eq("id", data.user.id)
                .maybeSingle();

            if (profile && profile.totp_enabled) {
                // 开了 2FA：登出，进入动态码阶段
                const { data: mfa } = await db
                    .from("user_mfa")
                    .select("secret")
                    .eq("user_id", data.user.id)
                    .maybeSingle();

                if (!mfa) {
                    msg.textContent = "2FA 数据异常，请联系管理员";
                    msg.className = "msg error";
                    await db.auth.signOut();
                    return;
                }

                tempUsername = username;
                tempPassword = password;
                tempSecret = mfa.secret;

                await db.auth.signOut();

                stage = "totp";
                usernameInput.disabled = true;
                passwordInput.disabled = true;
                totpInput.style.display = "block";
                totpInput.value = "";
                totpInput.focus();
                submitBtn.textContent = "验证并登录";
                backBtn.style.display = "block";
                subtitle.textContent = "请输入验证器 App 上的 6 位动态码";
                msg.textContent = "";
                msg.className = "msg";
                return;
            }

            // 没开 2FA，直接进
            msg.textContent = "登录成功，正在跳转…";
            msg.className = "msg ok";
            setTimeout(() => {
                window.location.href = "/talkroom/";
            }, 500);
        }

        async function doTotpStage() {
            const code = totpInput.value.trim();
            if (code.length !== 6) {
                msg.textContent = "请输入 6 位动态码";
                msg.className = "msg error";
                return;
            }

            // 验证动态码
            try {
                const res = await fetch(WASMER_URL + "/mfa/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ secret: tempSecret, token: code })
                });
                const result = await res.json();

                if (!result.success) {
                    msg.textContent = "动态码错误或已过期";
                    msg.className = "msg error";
                    return;
                }
            } catch (e) {
                msg.textContent = "验证失败：" + e.message;
                msg.className = "msg error";
                return;
            }

            // 动态码正确，重新登录
            const { error } = await db.auth.signInWithPassword({
                email: `${tempUsername}@hgt.l.cd`,
                password: tempPassword
            });

            if (error) {
                msg.textContent = "登录失败，请重试";
                msg.className = "msg error";
                return;
            }

            msg.textContent = "登录成功，正在跳转…";
            msg.className = "msg ok";
            setTimeout(() => {
                window.location.href = "/talkroom/";
            }, 500);
        }

        async function doRegister() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                msg.textContent = "用户名和密码都不能为空";
                msg.className = "msg error";
                return;
            }

            if (username.length > 20) {
                msg.textContent = "用户名最多 20 个字";
                msg.className = "msg error";
                return;
            }

            if (password.length < 6) {
                msg.textContent = "密码至少 6 位";
                msg.className = "msg error";
                return;
            }

            const fakeEmail = `${username}@hgt.l.cd`;

            const { data, error } = await db.auth.signUp({
                email: fakeEmail,
                password: password
            });

            if (error) {
                if (error.message.includes("already")) {
                    msg.textContent = "这个用户名已经被注册了";
                } else {
                    msg.textContent = "注册失败：" + error.message;
                }
                msg.className = "msg error";
                return;
            }

            if (data.user) {
                const { error: profileError } = await db.from("profiles").insert({
                    id: data.user.id,
                    username: username
                });
                if (profileError) {
                    console.error("存用户名失败:", profileError);
                }
            }

            msg.textContent = "注册成功，正在跳转…";
            msg.className = "msg ok";
            setTimeout(() => {
                window.location.href = "/talkroom/";
            }, 500);
        }

        backBtn.addEventListener("click", async () => {
            // 回到密码阶段
            await db.auth.signOut();
            stage = "password";
            usernameInput.disabled = false;
            passwordInput.disabled = false;
            totpInput.style.display = "none";
            totpInput.value = "";
            submitBtn.textContent = "登录";
            backBtn.style.display = "none";
            subtitle.textContent = "输入用户名和密码";
            msg.textContent = "";
            msg.className = "msg";
        });

        passwordInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitBtn.click();
        });
        totpInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitBtn.click();
        });
    </script>
</body>
</html>
