<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号设置 · hg1.dpdns.org</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 36px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 22px; color: #333; margin-bottom: 20px; text-align: center; }
        .section {
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .section h2 { font-size: 16px; color: #333; margin-bottom: 10px; }
        .section p { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 14px; }
        .btn {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #5568d3; }
        .btn.secondary { background: #f0f2f8; color: #666; }
        .btn.danger { background: #e74c3c; }
        .status { font-size: 13px; margin-top: 10px; }
        .status.on { color: #27ae60; }
        .status.off { color: #999; }
        .qr-box { text-align: center; margin: 16px 0; }
        .qr-box img { max-width: 200px; border-radius: 12px; border: 1px solid #eee; }
        .secret-text {
            font-family: monospace;
            font-size: 13px;
            background: #f7f8fc;
            padding: 8px 12px;
            border-radius: 8px;
            word-break: break-all;
            margin: 10px 0;
        }
        .input-row { display: flex; gap: 8px; margin-top: 12px; }
        .input-row input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 15px;
            outline: none;
            text-align: center;
            letter-spacing: 4px;
        }
        .input-row input:focus { border-color: #667eea; }
        .back { text-align: center; margin-top: 20px; }
        .back a { color: #667eea; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 账号设置</h1>

        <div class="section" id="mfaSection">
            <h2>两步验证（2FA）</h2>
            <p>开启后，登录时需要额外输入验证器 App 上的动态验证码。</p>
            <div class="status" id="mfaStatus">检测中…</div>
            <button class="btn" id="enableMfaBtn" style="margin-top: 12px;">开启 2FA</button>
        </div>

        <div class="back"><a href="/talkroom/">← 返回入口</a></div>
    </div>

    <!-- 绑定弹窗 -->
    <div class="modal-overlay" id="modalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:20px; z-index:1000;">
        <div style="background:#fff; border-radius:20px; padding:28px; max-width:420px; width:100%; max-height:90vh; overflow-y:auto;">
            <h2 style="font-size:19px; color:#333; margin-bottom:16px;">绑定验证器</h2>
            <p style="font-size:13px; color:#666; line-height:1.6; margin-bottom:16px;">
                用验证器 App（Google Authenticator、Microsoft Authenticator 等）扫描下面的二维码：
            </p>
            <div class="qr-box" id="qrBox"></div>
            <p style="font-size:12px; color:#999; margin-bottom:6px;">扫不了？手动输入密钥：</p>
            <div class="secret-text" id="secretText"></div>
            <p style="font-size:13px; color:#666; margin-top:16px;">输入 App 上显示的 6 位验证码：</p>
            <div class="input-row">
                <input type="text" id="verifyCode" maxlength="6" placeholder="000000">
                <button class="btn" id="verifyBtn">验证</button>
            </div>
            <div id="verifyMsg" style="font-size:13px; margin-top:10px; min-height:18px;"></div>
            <button class="btn secondary" id="cancelBtn" style="margin-top:16px; width:100%;">取消</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";
        const WASMER_URL = "https://hgai-61677.wasmer.app";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        let userId = null;
        let username = null;
        let currentSecret = null;

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session || !session.user) {
                window.location.href = "/talkroom/login/";
                return;
            }
            userId = session.user.id;

            const { data: profile } = await db
                .from("profiles")
                .select("username, totp_enabled")
                .eq("id", userId)
                .maybeSingle();

            username = profile ? profile.username : "用户";

            const statusEl = document.getElementById("mfaStatus");
            const btn = document.getElementById("enableMfaBtn");

            if (profile && profile.totp_enabled) {
                statusEl.textContent = "✅ 已开启";
                statusEl.className = "status on";
                btn.textContent = "关闭 2FA";
                btn.classList.add("danger");
                btn.onclick = disableMfa;
            } else {
                statusEl.textContent = "❌ 未开启";
                statusEl.className = "status off";
                btn.textContent = "开启 2FA";
                btn.onclick = startMfaSetup;
            }
        }

        async function startMfaSetup() {
            try {
                const res = await fetch(WASMER_URL + "/mfa/setup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, username: username })
                });
                const data = await res.json();

                if (!data.secret) {
                    alert("生成失败");
                    return;
                }

                currentSecret = data.secret;
                document.getElementById("qrBox").innerHTML =
                    `<img src="data:image/png;base64,${data.qr_base64}" alt="QR">`;
                document.getElementById("secretText").textContent = data.secret;
                document.getElementById("verifyCode").value = "";
                document.getElementById("verifyMsg").textContent = "";
                document.getElementById("modalOverlay").style.display = "flex";

            } catch (e) {
                alert("请求失败：" + e.message);
            }
        }

        document.getElementById("verifyBtn").onclick = async () => {
            const code = document.getElementById("verifyCode").value.trim();
            const msg = document.getElementById("verifyMsg");

            if (code.length !== 6) {
                msg.textContent = "请输入 6 位验证码";
                msg.style.color = "#e74c3c";
                return;
            }

            // 用 Wasmer 的 /mfa/verify 接口验证
            try {
                const res = await fetch(WASMER_URL + "/mfa/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ secret: currentSecret, token: code })
                });
                const data = await res.json();

                if (data.success) {
                    // 验证通过，把 secret 存到 Supabase
                    await db.from("profiles").update({
                        totp_enabled: true
                    }).eq("id", userId);

                    // 同时把 secret 存到一个新表（待会儿建）
                    await db.from("user_mfa").upsert({
                        user_id: userId,
                        secret: currentSecret
                    });

                    msg.textContent = "✅ 绑定成功！";
                    msg.style.color = "#27ae60";
                    setTimeout(() => {
                        document.getElementById("modalOverlay").style.display = "none";
                        init();
                    }, 1500);
                } else {
                    msg.textContent = "验证码错误或已过期";
                    msg.style.color = "#e74c3c";
                }
            } catch (e) {
                msg.textContent = "请求失败：" + e.message;
                msg.style.color = "#e74c3c";
            }
        };

        document.getElementById("cancelBtn").onclick = () => {
            document.getElementById("modalOverlay").style.display = "none";
        };

        async function disableMfa() {
            if (!confirm("确定要关闭 2FA 吗？")) return;

            await db.from("profiles").update({ totp_enabled: false }).eq("id", userId);
            await db.from("user_mfa").delete().eq("user_id", userId);

            alert("已关闭");
            init();
        }

        init();
    </script>
</body>
</html>
