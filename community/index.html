<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区 · hg1.dpdns.org</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 720px; width: 100%; }

        .header {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 24px 28px;
            margin-bottom: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header h1 { font-size: 24px; color: #333; }

        .post-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .post-card:hover { transform: translateY(-2px); }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #999;
        }

        .post-title {
            font-size: 17px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .post-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 12px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .post-actions {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #999;
        }

        .post-actions span { cursor: pointer; }
        .post-actions .liked { color: #e74c3c; }

        .post-detail {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: none;
        }

        .post-detail.active { display: block; }

        .post-detail .title { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .post-detail .meta { font-size: 12px; color: #999; margin-bottom: 16px; }
        .post-detail .content { font-size: 15px; color: #444; line-height: 1.8; margin-bottom: 20px; white-space: pre-wrap; }

        .comment-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .comment-item .meta { font-size: 12px; color: #999; margin-bottom: 4px; }
        .comment-item .text { color: #444; line-height: 1.6; }

        .comment-input-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .comment-input-row input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 14px;
            outline: none;
        }

        .comment-input-row input:focus { border-color: #667eea; }

        .comment-input-row button {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
        }

        .back-btn {
            display: inline-block;
            background: #f0f2f8;
            color: #667eea;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .new-post-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #667eea;
            color: #fff;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
            transition: 0.2s;
        }

        .new-post-btn:hover { transform: scale(1.1); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal h2 { font-size: 20px; color: #333; margin-bottom: 16px; }

        .modal input, .modal textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            font-family: inherit;
        }

        .modal input:focus, .modal textarea:focus { border-color: #667eea; }

        .modal textarea { resize: vertical; min-height: 120px; }

        .modal-btns { display: flex; gap: 10px; }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
        }

        .modal-btns .cancel { background: #f0f2f8; color: #666; }
        .modal-btns .submit { background: #667eea; color: #fff; }

        .empty { text-align: center; color: #fff; font-size: 15px; padding: 40px; opacity: 0.8; }
        .loading { text-align: center; color: #fff; font-size: 15px; padding: 40px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 社区</h1>
        </div>

        <div id="postList" class="loading">加载中…</div>
        <div class="post-detail" id="postDetail"></div>
    </div>

    <button class="new-post-btn" id="newPostBtn">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>发新帖</h2>
            <input type="text" id="postTitle" placeholder="标题" maxlength="50">
            <textarea id="postContent" placeholder="正文…" maxlength="2000"></textarea>
            <div class="modal-btns">
                <button class="cancel" id="cancelPost">取消</button>
                <button class="submit" id="submitPost">发布</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        const postList = document.getElementById("postList");
        const postDetail = document.getElementById("postDetail");
        const modalOverlay = document.getElementById("modalOverlay");

        let userId = null;
        let username = null;
        let myLikes = new Set();
        let postsCache = [];

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session || !session.user) {
                window.location.href = "/talkroom/login/";
                return;
            }
            userId = session.user.id;

            const { data: profile } = await db
                .from("profiles")
                .select("username")
                .eq("id", userId)
                .maybeSingle();
            username = profile ? profile.username : "匿名";

            await loadMyLikes();
            await loadPosts();
        }

        async function loadMyLikes() {
            const { data } = await db
                .from("post_likes")
                .select("post_id")
                .eq("user_id", userId);
            myLikes = new Set((data || []).map(d => d.post_id));
        }

        async function loadPosts() {
            postList.innerHTML = '<div class="loading">加载中…</div>';
            postDetail.classList.remove("active");
            postList.style.display = "block";

            const { data, error } = await db
                .from("posts")
                .select("*")
                .order("created_at", { ascending: false })
                .limit(100);

            if (error) {
                postList.innerHTML = '<div class="empty">加载失败</div>';
                return;
            }

            postsCache = data;

            if (data.length === 0) {
                postList.innerHTML = '<div class="empty">还没有帖子，来发第一帖吧</div>';
                return;
            }

            const postIds = data.map(p => p.id);
            const { data: commentCounts } = await db
                .from("comments")
                .select("post_id")
                .in("post_id", postIds);

            const countMap = {};
            (commentCounts || []).forEach(c => {
                countMap[c.post_id] = (countMap[c.post_id] || 0) + 1;
            });

            postList.innerHTML = "";
            data.forEach(post => {
                const card = document.createElement("div");
                card.className = "post-card";
                const liked = myLikes.has(post.id);
                card.innerHTML = `
                    <div class="post-header">
                        <span>${escapeHtml(post.author_name || "匿名")}</span>
                        <span>${formatTime(post.created_at)}</span>
                    </div>
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-preview">${escapeHtml(post.content)}</div>
                    <div class="post-actions">
                        <span class="like-btn ${liked ? 'liked' : ''}" data-id="${post.id}">
                            ${liked ? '❤️' : '🤍'} ${post.likes || 0}
                        </span>
                        <span>💬 ${countMap[post.id] || 0}</span>
                    </div>
                `;
                card.querySelector(".like-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    toggleLike(post.id);
                });
                card.addEventListener("click", () => openPost(post.id));
                postList.appendChild(card);
            });
        }

        async function toggleLike(postId) {
            const post = postsCache.find(p => p.id === postId);
            if (myLikes.has(postId)) {
                await db.from("post_likes").delete().eq("post_id", postId).eq("user_id", userId);
                myLikes.delete(postId);
                if (post) {
                    await db.from("posts").update({ likes: Math.max(0, (post.likes || 0) - 1) }).eq("id", postId);
                }
            } else {
                await db.from("post_likes").insert({ post_id: postId, user_id: userId });
                myLikes.add(postId);
                if (post) {
                    await db.from("posts").update({ likes: (post.likes || 0) + 1 }).eq("id", postId);
                }
            }
            await loadPosts();
        }

        async function openPost(postId) {
            const post = postsCache.find(p => p.id === postId);
            if (!post) return;

            const { data: comments } = await db
                .from("comments")
                .select("*")
                .eq("post_id", postId)
                .order("created_at", { ascending: true });

            postList.style.display = "none";
            postDetail.classList.add("active");
            postDetail.innerHTML = `
                <button class="back-btn" id="backBtn">← 返回列表</button>
                <div class="title">${escapeHtml(post.title)}</div>
                <div class="meta">${escapeHtml(post.author_name || "匿名")} · ${formatTime(post.created_at)}</div>
                <div class="content">${escapeHtml(post.content)}</div>
                <div style="font-size:15px; font-weight:600; color:#333; margin-bottom:12px;">评论 (${comments.length})</div>
                <div id="commentsList">
                    ${comments.length === 0 ? '<div style="color:#999;font-size:14px;padding:10px 0;">还没有评论</div>' : comments.map(c => `
                        <div class="comment-item">
                            <div class="meta">${escapeHtml(c.author_name || "匿名")} · ${formatTime(c.created_at)}</div>
                            <div class="text">${escapeHtml(c.content)}</div>
                        </div>
                    `).join("")}
                </div>
                <div class="comment-input-row">
                    <input type="text" id="commentInput" placeholder="写评论…" maxlength="200">
                    <button id="commentBtn">发送</button>
                </div>
            `;

            document.getElementById("backBtn").addEventListener("click", () => {
                postDetail.classList.remove("active");
                postList.style.display = "block";
            });

            document.getElementById("commentBtn").addEventListener("click", () => submitComment(postId));
            document.getElementById("commentInput").addEventListener("keydown", (e) => {
                if (e.key === "Enter") submitComment(postId);
            });
        }

        async function submitComment(postId) {
            const input = document.getElementById("commentInput");
            const text = input.value.trim();
            if (!text) return;

            await db.from("comments").insert({
                post_id: postId,
                author_id: userId,
                author_name: username,
                content: text
            });

            input.value = "";
            await openPost(postId);
        }

        document.getElementById("newPostBtn").addEventListener("click", () => {
            modalOverlay.classList.add("active");
        });

        document.getElementById("cancelPost").addEventListener("click", () => {
            modalOverlay.classList.remove("active");
        });

        document.getElementById("submitPost").addEventListener("click", async () => {
            const title = document.getElementById("postTitle").value.trim();
            const content = document.getElementById("postContent").value.trim();

            if (!title || !content) {
                alert("标题和正文都不能为空");
                return;
            }

            const { error } = await db.from("posts").insert({
                author_id: userId,
                author_name: username,
                title: title,
                content: content
            });

            if (error) {
                alert("发帖失败：" + error.message);
                return;
            }

            document.getElementById("postTitle").value = "";
            document.getElementById("postContent").value = "";
            modalOverlay.classList.remove("active");
            await loadPosts();
        });

        function formatTime(iso) {
            const d = new Date(iso);
            const now = new Date();
            const diff = (now - d) / 1000;
            if (diff < 60) return "刚刚";
            if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
            if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
            return d.toLocaleDateString("zh-CN");
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        init();
    </script>
</body>
</html>
