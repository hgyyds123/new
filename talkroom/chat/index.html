<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkroom · hg</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 字体与图标 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ================= Material 3 颜色角色 ================= */
        :root {
            /* 浅色模式 (Seed: #4285F4 变体) */
            --primary: #0b57d0;
            --on-primary: #ffffff;
            --primary-container: #d3e3fd;
            --on-primary-container: #041e49;
            --secondary-container: #e8def8;
            --on-secondary-container: #1d192b;
            --surface: #ffffff;
            --surface-variant: #f0f4f9;
            --on-surface: #1f1f1f;
            --on-surface-variant: #444746;
            --outline: #747775;
            --outline-variant: #c4c7c5;
            --error: #b3261e;
            --bg-color: #f8f9fa;
            
            /* 阴影 (Level 1 & Level 2) */
            --elevation-1: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.08);
            --elevation-2: 0 1px 2px rgba(0,0,0,.1), 0 2px 6px 2px rgba(0,0,0,.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 深色模式 */
                --primary: #a8c7fa;
                --on-primary: #062e6f;
                --primary-container: #0842a0;
                --on-primary-container: #d3e3fd;
                --secondary-container: #4a148c;
                --on-secondary-container: #e8def8;
                --surface: #1e1f20;
                --surface-variant: #282a2c;
                --on-surface: #e3e3e3;
                --on-surface-variant: #c4c7c5;
                --outline: #8e918f;
                --outline-variant: #444746;
                --error: #f2b8b5;
                --bg-color: #131314;
            }
        }

        /* ================= 全局与重置 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-color);
            color: var(--on-surface);
            font-family: 'Roboto', 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 滚动条适配 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--outline); }

        /* ================= 布局 ================= */
        .layout {
            display: flex;
            gap: 24px;
            max-width: 1000px;
            width: 100%;
            height: 85vh;
            padding: 24px;
        }

        /* ================= 聊天气泡卡片 ================= */
        .chat-card {
            flex: 1;
            background-color: var(--surface);
            border-radius: 24px;
            box-shadow: var(--elevation-1);
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        /* 顶部应用栏 */
        .top-app-bar {
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--outline-variant);
        }
        .top-app-bar .title {
            font-size: 22px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-app-bar .account-info {
            font-size: 14px;
            color: var(--on-surface-variant);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .avatar-sm {
            width: 32px; height: 32px;
            border-radius: 50%;
            background-color: var(--primary-container);
            color: var(--on-primary-container);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 500;
        }

        /* 消息列表区 */
        .messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: var(--surface-variant);
        }

        /* 气泡样式 */
        .msg-row { display: flex; flex-direction: column; max-width: 80%; }
        .msg-row.me { align-self: flex-end; align-items: flex-end; }
        .msg-row.other { align-self: flex-start; align-items: flex-start; }
        
        .msg-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--on-surface-variant);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: var(--elevation-1);
        }
        
        .msg-row.other .msg-bubble {
            background-color: var(--surface);
            color: var(--on-surface);
            border-top-left-radius: 4px;
        }

        .msg-row.me .msg-bubble {
            background-color: var(--primary);
            color: var(--on-primary);
            border-top-right-radius: 4px;
        }

        .msg-bubble img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        /* 输入区 */
        .input-area {
            padding: 16px 24px;
            background-color: var(--surface);
            border-top: 1px solid var(--outline-variant);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--surface-variant);
            border-radius: 9999px; /* 药丸形 */
            padding: 8px 8px 8px 24px;
            transition: background-color 0.2s;
        }
        .input-wrapper:focus-within {
            background-color: var(--surface);
            box-shadow: var(--elevation-1);
            outline: 1px solid var(--outline-variant);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: var(--on-surface);
        }
        .input-wrapper input::placeholder { color: var(--on-surface-variant); }

        .btn-send {
            height: 40px;
            padding: 0 24px;
            border-radius: 9999px; /* 药丸形 */
            background-color: var(--primary);
            color: var(--on-primary);
            font-size: 14px;
            font-weight: 500;
            display: flex; align-items: center; gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-send:hover { background-color: var(--primary); opacity: 0.9; }
        .btn-send:disabled { background-color: var(--outline-variant); color: var(--on-surface-variant); cursor: not-allowed; }

        /* ================= 侧边栏 (AI 余额 & 状态) ================= */
        .sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .side-card {
            background-color: var(--surface);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--elevation-1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .side-card .label {
            font-size: 14px;
            font-weight: 500;
            color: var(--on-surface-variant);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .side-card .value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        .side-card .value.low { color: #e67e22; }
        .side-card .value.critical { color: var(--error); }
        
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            background-color: var(--secondary-container);
            color: var(--on-secondary-container);
            font-size: 13px;
            font-weight: 500;
        }

        /* ================= 工具类与适配 ================= */
        .m3-ripple { position: relative; overflow: hidden; }
        .ripple-circle { position: absolute; border-radius: 50%; background-color: rgba(128,128,128,0.2); transform: scale(0); animation: ripple 0.3s linear; pointer-events: none; }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        @media (max-width: 840px) {
            .layout { flex-direction: column; padding: 0; height: 100vh; gap: 0; }
            .chat-card { border-radius: 0; height: 100%; box-shadow: none; }
            .sidebar { display: none; } /* 移动端隐藏侧边栏，极简优先 */
            .top-app-bar { border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="layout">
        <!-- 主聊天卡片 -->
        <main class="chat-card">
            <header class="top-app-bar">
                <div class="title">
                    <span class="material-symbols-outlined">forum</span>
                    Talkroom
                </div>
                <div class="account-info">
                    <span id="myNickname">加载中...</span>
                    <div class="avatar-sm" id="avatarInitial">?</div>
                </div>
            </header>

            <div class="messages" id="messages">
                <!-- 消息会在这里动态渲染 -->
                <div class="msg-row other">
                    <div class="msg-name">系统</div>
                    <div class="msg-bubble">正在连接聊天室...</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="发消息..." maxlength="100" autocomplete="off">
                    <button class="btn-send m3-ripple" id="sendBtn">
                        <span class="material-symbols-outlined" style="font-size: 20px;">send</span>
                        发送
                    </button>
                </div>
            </div>
        </main>

        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="side-card">
                <div class="label">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    AI 余额
                </div>
                <div class="value" id="balanceValue">...</div>
                <div style="font-size: 12px; color: var(--on-surface-variant);">pollen</div>
            </div>
            
            <div class="side-card">
                <div class="label">
                    <span class="material-symbols-outlined">info</span>
                    状态
                </div>
                <div class="status-chip">
                    <span class="material-symbols-outlined" style="font-size: 16px;">sensors</span>
                    轮询已连接
                </div>
                <p style="font-size: 12px; color: var(--on-surface-variant); line-height: 1.5; margin-top: 4px;">
                    为了保证国内直连，当前使用 2 秒轮询获取消息。请文明发言。
                </p>
            </div>
        </aside>
    </div>

    <script>
        const BLOCKED_WORDS = ["广告", "加群", "代练", "傻逼", "操你", "尼玛", "滚"];
        const MAX_MSG_LENGTH = 100;
        const SEND_COOLDOWN = 3000;
        
        const WASMER_URL = CONFIG.WASMER_URL;
        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_KEY;

        function containsBlockedWord(text) {
            return BLOCKED_WORDS.some(word => text.includes(word));
        }

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        const messagesEl = document.getElementById("messages");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");

        let userId = null;
        let username = null;
        let lastMessageId = null;

        // M3 水波纹效果
        document.addEventListener('click', function(e) {
            const target = e.target.closest('.m3-ripple');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const circle = document.createElement('span');
            circle.classList.add('ripple-circle');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = size + 'px';
            circle.style.left = (e.clientX - rect.left - size / 2) + 'px';
            circle.style.top = (e.clientY - rect.top - size / 2) + 'px';
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 300);
        });

        // 查余额
        async function checkBalance() {
            const el = document.getElementById("balanceValue");
            try {
                const res = await fetch(WASMER_URL + "/balance");
                const data = await res.json();
                if (data.balance !== undefined) {
                    const bal = Number(data.balance);
                    el.textContent = bal.toFixed(4);
                    el.className = "value";
                    if (bal < 0.05) el.className = "value critical";
                    else if (bal < 0.15) el.className = "value low";
                } else {
                    el.textContent = "未知";
                }
            } catch (e) {
                el.textContent = "离线";
                el.className = "value critical";
            }
        }
        checkBalance();
        setInterval(checkBalance, 60000);

        // 初始化
        async function initAuth() {
            const { data: { session } } = await db.auth.getSession();
            if (!session || !session.user) {
                window.location.href = "/account/login/?redirect=/talkroom/chat/";
                return;
            }
            userId = session.user.id;

            const { data: profile } = await db.from("profiles").select("username").eq("id", userId).maybeSingle();
            username = profile ? profile.username : "未知用户";
            
            document.getElementById("myNickname").textContent = username;
            if (username) {
                document.getElementById("avatarInitial").textContent = username.charAt(0).toUpperCase();
            }

            const { data: banData } = await db.from("banned").select("user_id").eq("user_id", userId).maybeSingle();
            if (banData) {
                document.body.innerHTML = '<div style="text-align:center;padding:50px;color:var(--error)"><h1>403</h1><p>你已被封禁</p></div>';
                return;
            }

            initChat();
        }

        function initChat() {
            messagesEl.innerHTML = '<div class="msg-row other"><div class="msg-name">系统</div><div class="msg-bubble">已连接，正在拉取最新消息...</div></div>';
            
            fetchMessages();
            setInterval(fetchMessages, 2000); // 2秒轮询
        }

        async function fetchMessages() {
            try {
                const { data, error } = await db.from("messages").select("*").is("conversation_id", null).order("created_at", { ascending: false }).limit(50);
                if (error) return;
                if (data.length === 0) return;

                data.reverse();
                const latestMsg = data[data.length - 1];
                
                // 没有新消息就不重绘
                if (lastMessageId === latestMsg.id) return; 
                lastMessageId = latestMsg.id;

                messagesEl.innerHTML = "";
                data.forEach(row => {
                    const isMe = row.user_id === userId;
                    const div = document.createElement("div");
                    div.className = `msg-row ${isMe ? 'me' : 'other'}`;
                    
                    const content = row.content || "";
                    const isImage = content.startsWith('<img ');
                    const finalContent = isImage ? content : escapeHtml(content);

                    div.innerHTML = `
                        <div class="msg-name">${escapeHtml(row.nickname || "匿名")}</div>
                        <div class="msg-bubble">${finalContent}</div>
                    `;
                    messagesEl.appendChild(div);
                });
                messagesEl.scrollTop = messagesEl.scrollHeight;
            } catch (err) {
                console.error("拉取失败", err);
            }
        }

        let lastSendTime = 0;
        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            if (text.length > MAX_MSG_LENGTH) return alert("消息太长");
            if (containsBlockedWord(text)) return alert("包含违禁词");

            const now = Date.now();
            if (now - lastSendTime < SEND_COOLDOWN) return alert("发送太快，请稍等");
            lastSendTime = now;

            msgInput.value = "";
            const { error } = await db.from("messages").insert({
                content: text, nickname: username, user_id: userId
            });
            if (error) {
                alert("发送失败");
            } else {
                fetchMessages();
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        function escapeHtml(str) {
            return String(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
        }

        initAuth();
    </script>
</body>
</html>
