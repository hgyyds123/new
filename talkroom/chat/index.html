<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共聊天室 · hg</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #F8F9FA; --surface: #FFFFFF; --surface-variant: #F0F4F9;
            --text-main: #1F1F1F; --text-sub: #444746; --outline-variant: #C4C7C5;
            --primary: #0b57d0; --on-primary: #FFFFFF; --primary-container: #d3e3fd;
            --on-primary-container: #041e49; --error: #B3261E;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #131314; --surface: #1E1F20; --surface-variant: #282A2C;
                --text-main: #E3E3E3; --text-sub: #C4C7C5; --outline-variant: #444746;
                --primary: #A8C7FA; --on-primary: #062E6F; --primary-container: #0842A0;
                --on-primary-container: #D3E3FD; --error: #F2B8B5;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Roboto', 'Noto Sans SC', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; }

        .top-bar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background-color: var(--bg-color); border-bottom: 1px solid var(--outline-variant); flex-shrink: 0; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: background 0.2s; }
        .icon-btn:hover { background-color: var(--surface-variant); }
        .brand { font-size: 20px; font-weight: 500; }
        .user-info { font-size: 14px; color: var(--text-sub); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 1000px; margin: 0 auto; width: 100%; background-color: var(--bg-color); position: relative; min-width: 0; }

        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .msg-bubble { display: flex; flex-direction: column; max-width: 75%; align-self: flex-start; }
        .msg-bubble.mine { align-self: flex-end; align-items: flex-end; }
        .msg-name { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; padding: 0 4px; }
        .msg-content { background-color: var(--surface); padding: 12px 16px; border-radius: 4px 16px 16px 16px; font-size: 15px; line-height: 1.5; color: var(--text-main); word-break: break-word; border: 1px solid var(--outline-variant); }
        .msg-bubble.mine .msg-content { background-color: var(--primary); color: var(--on-primary); border: none; border-radius: 16px 4px 16px 16px; }

        .input-area { padding: 16px 24px; background-color: var(--bg-color); border-top: 1px solid var(--outline-variant); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .input-area input { flex: 1; height: 48px; background-color: var(--surface); border: 1px solid var(--outline-variant); border-radius: 24px; padding: 0 20px; font-size: 15px; color: var(--text-main); outline: none; transition: border-color 0.2s; }
        .input-area input:focus { border-color: var(--primary); }
        .send-btn { width: 48px; height: 48px; border-radius: 50%; background-color: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="nav-left">
            <a href="/talkroom/" class="icon-btn"><span class="material-symbols-outlined">arrow_back</span></a>
            <div class="brand">公共聊天室</div>
        </div>
        <div class="user-info" id="userInfo">加载中...</div>
    </header>

    <main class="chat-container">
        <div class="messages" id="messages">
            <div style="text-align:center; color:var(--text-sub); font-size:14px; margin-top:20px;">正在拉取最新消息...</div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="发送消息..." maxlength="200" autocomplete="off">
            <button class="send-btn" id="sendBtn"><span class="material-symbols-outlined">send</span></button>
        </div>
    </main>

    <script>
        // 【修复】走 Wasmer 代理，绕开国内无法直连 Supabase 的问题
        const SUPABASE_URL = "https://hgai-61677.wasmer.app/proxy";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";

        const messagesEl = document.getElementById("messages");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        const userInfo = document.getElementById("userInfo");

        const myUserId = localStorage.getItem("hg_user_id") || sessionStorage.getItem("hg_user_id");
        const myUsername = localStorage.getItem("hg_username") || sessionStorage.getItem("hg_username") || "匿名";

        if (!myUserId) {
            window.location.href = `/account/login/?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`;
        } else {
            userInfo.textContent = myUsername;
        }

        let isLoading = false;
        let pendingLoad = false;
        let hasInitialized = false; // 首次加载标记

        async function loadMessages(force = false) {
            if (isLoading) {
                if (force) pendingLoad = true; // 如果发消息后强制刷新遇到了锁，就排队
                return;
            }
            isLoading = true;

            try {
                // 查询最新 50 条，倒序拉取
                const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?conversation_id=is.null&order=created_at.desc&limit=50`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (!Array.isArray(data)) throw new Error("返回数据格式错误");
                data.reverse(); // 反转成正序渲染

                if (data.length === 0) {
                    if (messagesEl.innerHTML.includes("正在拉取")) {
                        messagesEl.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:14px; margin-top:20px;">还没有消息，发一句试试吧！</div>';
                    }
                    return;
                }

                if (messagesEl.children.length === 1 && messagesEl.children[0].innerText.includes("正在拉取")) {
                    messagesEl.innerHTML = "";
                }

                let hasNewMessage = false;
                data.forEach(msg => {
                    // 彻底删掉总闸，直接靠 data-id 逐一判重
                    if (document.querySelector(`[data-id="${msg.id}"]`)) return;

                    const isMine = msg.user_id === myUserId;
                    const div = document.createElement("div");
                    div.className = `msg-bubble ${isMine ? 'mine' : ''}`;
                    div.setAttribute("data-id", msg.id);
                    div.innerHTML = `
                        <div class="msg-name">${isMine ? '我' : escapeHtml(msg.nickname || "匿名")}</div>
                        <div class="msg-content">${escapeHtml(msg.content)}</div>
                    `;
                    messagesEl.appendChild(div);
                    hasNewMessage = true;
                });

                // 【修复滚动】判断用户当前是不是在底部
                const isNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 150;
                
                // 首次加载，或者有新消息且本来就在底部，才滚屏
                if (!hasInitialized || (hasNewMessage && isNearBottom)) {
                    scrollToBottom();
                    hasInitialized = true;
                }

            } catch (e) {
                console.error("拉取失败:", e);
            } finally {
                isLoading = false;
                if (pendingLoad) {
                    pendingLoad = false;
                    loadMessages();
                }
            }
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !myUserId) return;

            sendBtn.disabled = true;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
                        content: text,
                        nickname: myUsername,
                        user_id: myUserId,
                        conversation_id: null
                    })
                });

                if (!res.ok) throw new Error("发送失败");
                
                msgInput.value = ""; 
                msgInput.focus(); 
                
                // 强制刷新，无视锁
                await loadMessages(true); 

            } catch (e) {
                alert("发送失败：" + e.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function escapeHtml(str) {
            return String(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
        }

        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

        // 启动
        loadMessages();
        setInterval(() => loadMessages(), 2000);
    </script>
</body>
</html>
