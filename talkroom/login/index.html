<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="preload" href="/material-symbols.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 400; font-display: block; src: url('/material-symbols.woff2') format('woff2'); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转…</title>
    <script>
        // 保留 redirect 参数传给 account/login
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        const target = redirect ? `/account/login/?redirect=${encodeURIComponent(redirect)}` : '/account/login/';
        location.replace(target);
    </script>
</head>
<body>
    如果没有自动跳转，请点击：<a href="/account/login/">前往登录页</a>
</body>
</html>
