<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的消息 · 聊天室</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 640px;
            width: 100%;
        }

        .header {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .header h1 { font-size: 24px; color: #333; margin-bottom: 6px; }
        .header p { font-size: 14px; color: #999; }

        .msg-item {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .msg-item .time {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .msg-item .content {
            font-size: 15px;
            color: #444;
            line-height: 1.8;
            word-break: break-word;
        }

        .msg-item .badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            background: #f0f2f8;
            color: #888;
        }

        .msg-item .badge.private {
            background: #e8e0f8;
            color: #7a5fc0;
        }

        .empty {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: #999;
            font-size: 15px;
        }

        .back {
            text-align: center;
            margin-top: 24px;
        }

        .back a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
        }

        .back a:hover { opacity: 1; }

        .forbidden { text-align: center; padding: 120px 20px; }
        .forbidden h1 { font-size: 64px; color: #e74c3c; margin-bottom: 16px; }
        .forbidden p { font-size: 17px; color: #666; }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="empty">加载中…</div>
    </div>

    <script>
        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session || !session.user) {
                window.location.href = "/talkroom/login/";
                return;
            }

            const userId = session.user.id;

            // 拿用户名
            const { data: profile } = await db
                .from("profiles")
                .select("username")
                .eq("id", userId)
                .maybeSingle();

            const username = profile ? profile.username : "未知用户";

            // 查自己发过的所有消息（公共 + 私聊）
            const { data, error } = await db
                .from("messages")
                .select("*")
                .eq("user_id", userId)
                .order("created_at", { ascending: false })
                .limit(200);

            const container = document.getElementById("container");

            if (error) {
                container.innerHTML = '<div class="empty">加载失败：' + escapeHtml(error.message) + '</div>';
                return;
            }

            let html = `
                <div class="header">
                    <h1>📝 我的消息</h1>
                    <p>${escapeHtml(username)} 发过的消息（共 ${data.length} 条）</p>
                </div>
            `;

            if (data.length === 0) {
                html += '<div class="empty">你还没有发过消息</div>';
            } else {
                data.forEach(row => {
                    const time = new Date(row.created_at).toLocaleString("zh-CN");
                    const isPrivate = !!row.conversation_id;
                    html += `
                        <div class="msg-item">
                            <div class="time">
                                ${time}
                                <span class="badge ${isPrivate ? 'private' : ''}">${isPrivate ? '私聊' : '公共'}</span>
                            </div>
                            <div class="content">${escapeHtml(row.content)}</div>
                        </div>
                    `;
                });
            }

            html += '<div class="back"><a href="/talkroom/">← 返回入口</a></div>';

            container.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        init();
    </script>
</body>
</html>
