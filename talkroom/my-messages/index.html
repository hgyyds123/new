<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的消息 · 聊天室</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>@font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 400; src: url('/assets/fonts/material-symbols.woff2') format('woff2'); }</style>
    

    <style>
        :root {
            --bg-color: #F8F9FA; --surface: #FFFFFF; --surface-variant: #F0F4F9;
            --text-main: #1F1F1F; --text-sub: #444746; --outline-variant: #C4C7C5;
            --primary: #0b57d0; --on-primary: #FFFFFF; --primary-container: #d3e3fd;
            --on-primary-container: #041e49; --error: #B3261E;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #131314; --surface: #1E1F20; --surface-variant: #282A2C;
                --text-main: #E3E3E3; --text-sub: #C4C7C5; --outline-variant: #444746;
                --primary: #A8C7FA; --on-primary: #062E6F; --primary-container: #0842A0;
                --on-primary-container: #D3E3FD; --error: #F2B8B5;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Roboto', 'Noto Sans SC', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; }

        /* 顶部导航 */
        .top-bar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background-color: var(--bg-color); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--outline-variant); }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; color: var(--text-main); }
        .icon-btn:hover { background-color: var(--surface-variant); }
        .brand { font-size: 20px; font-weight: 500; }

        /* 主体内容 */
        .container { flex: 1; max-width: 800px; margin: 0 auto; width: 100%; padding: 32px 24px; }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { font-size: 32px; font-weight: 400; margin-bottom: 8px; }
        .header p { font-size: 15px; color: var(--text-sub); }

        /* 消息列表 */
        .msg-list { display: flex; flex-direction: column; gap: 12px; }
        
        .msg-card { 
            background-color: var(--surface); border: 1px solid var(--outline-variant); 
            border-radius: 16px; padding: 16px 20px; 
            transition: background 0.2s;
        }
        
        .msg-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .msg-time { font-size: 13px; color: var(--text-sub); }
        .msg-badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500; background-color: var(--surface-variant); color: var(--text-sub); }
        .msg-badge.private { background-color: var(--primary-container); color: var(--on-primary-container); }
        
        .msg-content { font-size: 15px; line-height: 1.6; color: var(--text-main); word-break: break-word; }
        .msg-content img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }

        .empty { text-align: center; padding: 64px 20px; color: var(--text-sub); font-size: 15px; background-color: var(--surface); border-radius: 16px; border: 1px dashed var(--outline-variant); }

        @media (max-width: 600px) {
            .container { padding: 24px 16px; }
            .header h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="nav-left">
            <a href="/talkroom/" class="icon-btn"><span class="material-symbols-outlined">arrow_back</span></a>
            <div class="brand">我的消息记录</div>
        </div>
    </header>

    <main class="container" id="container">
        <div class="empty">加载中...</div>
    </main>

    <script>
        // 【核心修复】走 Wasmer 代理
        const SUPABASE_URL = "https://hgai-61677.wasmer.app/proxy";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";

        async function init() {
            // 直接读本地缓存，不查网络，防横跳
            const myUserId = localStorage.getItem("hg_user_id") || sessionStorage.getItem("hg_user_id");
            const myUsername = localStorage.getItem("hg_username") || sessionStorage.getItem("hg_username") || "未知用户";

            if (!myUserId) {
                window.location.href = `/account/login/?redirect=${encodeURIComponent(window.location.pathname)}`;
                return;
            }

            const container = document.getElementById("container");

            try {
                // 用 fetch 走代理拉取数据
                const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?user_id=eq.${myUserId}&order=created_at.desc&limit=200`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (!Array.isArray(data)) throw new Error("返回数据格式错误");

                let html = `
                    <div class="header">
                        <h1>我的消息记录</h1>
                        <p>${escapeHtml(myUsername)} 发过的历史消息（共 ${data.length} 条）</p>
                    </div>
                `;

                if (data.length === 0) {
                    html += '<div class="empty">你还没有发过消息哦~</div>';
                } else {
                    html += '<div class="msg-list">';
                    data.forEach(row => {
                        const time = new Date(row.created_at).toLocaleString("zh-CN");
                        const isPrivate = !!row.conversation_id;
                        
                        html += `
                            <div class="msg-card">
                                <div class="msg-meta">
                                    <span class="msg-time">${time}</span>
                                    <span class="msg-badge ${isPrivate ? 'private' : ''}">${isPrivate ? '私聊' : '公共'}</span>
                                </div>
                                <div class="msg-content">${formatMessage(row.content)}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<div class="empty">加载失败：${escapeHtml(error.message)}</div>`;
            }
        }

        // 处理图片代理
        function formatMessage(text) {
            if (!text) return "";
            if (text.trim().startsWith('<img src="')) {
                const safeText = text.replace(/https:\/\/ufzywoswueqcxyopupjq\.supabase\.co/g, 'https://hgai-61677.wasmer.app/proxy');
                return safeText;
            }
            return escapeHtml(text);
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        init();
    </script>
</body>
</html>
