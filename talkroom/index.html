<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用大厅 · hg1.dpdns.org</title>
    
    <!-- 引入 Material Symbols 图标 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- 引入 Roboto 和 Noto Sans SC 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ================= Material 3 色彩令牌 (Light Mode) ================= */
        :root {
            --md-sys-color-primary: #0b57d0;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d3e3fd;
            --md-sys-color-on-primary-container: #041e49;
            
            --md-sys-color-secondary-container: #e8f0fe;
            --md-sys-color-on-secondary-container: #1f1f1f;
            
            --md-sys-color-surface: #F8F9FA;
            --md-sys-color-surface-container: #ffffff;
            --md-sys-color-on-surface: #1f1f1f;
            --md-sys-color-surface-variant: #e0e3e1;
            --md-sys-color-on-surface-variant: #444746;
            --md-sys-color-outline: #747775;
            --md-sys-color-outline-variant: #c4c7c5;
            --md-sys-color-error: #B3261E;
            
            --font-sans: 'Roboto', 'Noto Sans SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: var(--font-sans);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; }

        /* Ripple 动效 */
        .m3-ripple { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; }
        .ripple-circle {
            position: absolute; border-radius: 50%; background-color: rgba(0, 0, 0, 0.12);
            transform: scale(0); animation: ripple-anim 0.3s cubic-bezier(0.2, 0, 0, 1); pointer-events: none;
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        /* ================= 顶部导航栏 ================= */
        .top-app-bar {
            height: 64px; background-color: var(--md-sys-color-surface);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; position: sticky; top: 0; z-index: 100;
        }
        .top-app-bar .title { font-size: 22px; font-weight: 400; }
        
        .icon-btn {
            width: 48px; height: 48px; border-radius: 50%;
            color: var(--md-sys-color-on-surface-variant);
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: rgba(68, 71, 70, 0.08); }

        /* ================= 核心布局 ================= */
        .container { flex: 1; width: 100%; max-width: 840px; margin: 0 auto; padding: 32px 24px; }
        @media (max-width: 600px) { .container { padding: 24px 16px; } }

        /* ================= 排版阶梯 ================= */
        .headline-medium { font-size: 28px; font-weight: 400; line-height: 36px; margin-bottom: 8px; }
        .body-large { font-size: 16px; font-weight: 400; line-height: 24px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 32px; }
        .title-medium { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .label-large { font-size: 14px; font-weight: 500; }

        /* ================= 1. 主导航卡片 (List 样式) ================= */
        /* 单行高度 56px，左右内边距 16px，整行可点击，带极细分割线 */
        .list-group {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.08); /* Level 1 */
            margin-bottom: 32px;
        }
        
        .list-item {
            display: flex; align-items: center; gap: 16px;
            height: 72px; /* 双行列表高度 */
            padding: 0 16px;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            transition: background-color 0.2s;
        }
        .list-item:last-child { border-bottom: none; }
        
        .list-item .icon-wrap {
            width: 40px; height: 40px; border-radius: 50%;
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            display: flex; align-items: center; justify-content: center;
        }
        
        .list-item .text-content { flex: 1; }
        .list-item .desc { font-size: 14px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }
        .list-item .material-symbols-outlined.chevron { color: var(--md-sys-color-on-surface-variant); }

        /* ================= 2. 账号状态卡片 ================= */
        .account-card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 12px; padding: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,.08); /* Level 1 */
            margin-bottom: 32px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
        }
        .account-info { display: flex; align-items: center; gap: 16px; }
        .avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 500;
        }

        /* ================= 3. 按钮 ================= */
        .btn-filled {
            background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
            height: 40px; padding: 0 24px; border-radius: 9999px;
            font-size: 14px; font-weight: 500; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-filled:hover { background-color: #0842a0; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
        
        .btn-tonal {
            background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
            height: 40px; padding: 0 24px; border-radius: 9999px;
            font-size: 14px; font-weight: 500; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-tonal:hover { background-color: #d3e3fd; }
        
        .btn-text {
            color: var(--md-sys-color-primary); height: 40px; padding: 0 16px;
            border-radius: 9999px; font-size: 14px; font-weight: 500; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-text:hover { background-color: rgba(11, 87, 208, 0.08); }

        /* ================= 4. 底部功能 ================= */
        .quick-actions { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px;}

        @media (max-width: 600px) {
            .top-app-bar { display: none; } /* 手机端隐藏顶部，省空间 */
            .account-card { flex-direction: column; align-items: flex-start; }
            .account-card .btn-tonal { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 顶部应用栏 -->
    <header class="top-app-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="/" class="icon-btn m3-ripple">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div class="title">应用大厅</div>
        </div>
        <a href="/account/" class="icon-btn m3-ripple">
            <span class="material-symbols-outlined">settings</span>
        </a>
    </header>

    <!-- 主内容区 -->
    <main class="container">
        
        <!-- 标题排版 -->
        <h1 class="headline-medium">Talkroom 中枢</h1>
        <p class="body-large">管理你的社交、群组和 AI 交互，或者前往其他服务模块。</p>

        <!-- 账号状态卡片 -->
        <div class="account-card">
            <div class="account-info">
                <div class="avatar" id="avatarInitial">...</div>
                <div>
                    <div class="title-medium">当前账号：<span id="userNameDisplay">加载中...</span></div>
                    <div class="desc">已通过 Supabase 安全认证</div>
                </div>
            </div>
            <!-- 切换账号按钮 -->
            <a href="/account/login/" class="btn-tonal m3-ripple">
                <span class="material-symbols-outlined" style="font-size: 18px; margin-right: 8px;">switch_account</span>
                切换账号
            </a>
        </div>

        <!-- 核心功能列表 -->
        <div class="list-group">
            
            <!-- 进入聊天室 -->
            <a href="/talkroom/chat/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">forum</span></div>
                <div class="text-content">
                    <div class="title-medium">公共聊天室</div>
                    <div class="desc">加入大厅与所有人畅聊，召唤 AI 助手</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>

            <!-- 私信 / 私聊 -->
            <a href="/talkroom/private/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">chat_bubble</span></div>
                <div class="text-content">
                    <div class="title-medium">一对一私信</div>
                    <div class="desc">寻找在线好友，发送加密私密消息</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>

            <!-- 我的消息 -->
            <a href="/talkroom/my-messages/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">history</span></div>
                <div class="text-content">
                    <div class="title-medium">我的消息记录</div>
                    <div class="desc">查看你发送过的历史消息</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>
        </div>

        <!-- 其他站点链接 (绝对路径，防止 404) -->
        <h2 class="title-medium" style="margin-bottom: 16px;">其他服务</h2>
        <div class="quick-actions">
            <a href="https://hg1.dpdns.org/community/" class="btn-text m3-ripple">前往社区</a>
            <a href="https://hg1.dpdns.org/gs/" class="btn-text m3-ripple">游戏中心</a>
            <a href="https://hg1.dpdns.org/care/" class="btn-text m3-ripple">心理关怀</a>
            <a href="https://hg1.dpdns.org/talkroom/admin/" class="btn-text m3-ripple" style="color: var(--md-sys-color-error);">管理后台</a>
        </div>

    </main>

    <!-- Ripple 波纹脚本 -->
    <script>
        document.addEventListener('click', function(e) {
            const target = e.target.closest('.m3-ripple');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const circle = document.createElement('span');
            circle.classList.add('ripple-circle');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = size + 'px';
            circle.style.left = (x - size / 2) + 'px';
            circle.style.top = (y - size / 2) + 'px';
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 300);
        });

        // --- 下面是你原有的逻辑：获取当前登录的用户名 ---
        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";

        // 如果你用 supabase-js，请确保在 head 引入了脚本，或者这里直接拿 localStorage 的 session
        // 这里写个简易版逻辑用于演示
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadUserInfo() {
            const { data: { session } } = await db.auth.getSession();
            if (session && session.user) {
                const { data: profile } = await db
                    .from("profiles")
                    .select("username")
                    .eq("id", session.user.id)
                    .maybeSingle();
                
                const name = profile ? profile.username : "未知用户";
                document.getElementById("userNameDisplay").textContent = name;
                // 首字母作为头像
                if(name.length > 0) {
                    document.getElementById("avatarInitial").textContent = name.charAt(0).toUpperCase();
                }
            } else {
                // 如果没登录，直接踢回登录页
                window.location.href = "/account/login/";
            }
        }
        loadUserInfo();
    </script>
    <!-- 引入 Supabase 以防上面用到 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
