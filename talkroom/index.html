<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用大厅 · hg</title>
    
    <style>@font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 400; src: url('/assets/fonts/material-symbols.woff2') format('woff2'); }</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg-color: #F8F9FA; --surface: #FFFFFF; --surface-variant: #F0F4F9; --text-main: #1F1F1F; --text-sub: #444746; --outline-variant: #C4C7C5; --primary: #0b57d0; --on-primary: #FFFFFF; --primary-container: #d3e3fd; --on-primary-container: #041e49; --error: #B3261E; }
        @media (prefers-color-scheme: dark) { :root { --bg-color: #131314; --surface: #1E1F20; --surface-variant: #282A2C; --text-main: #E3E3E3; --text-sub: #C4C7C5; --outline-variant: #444746; --primary: #A8C7FA; --on-primary: #062E6F; --primary-container: #0842A0; --on-primary-container: #D3E3FD; --error: #F2B8B5; } }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Roboto', 'Noto Sans SC', sans-serif; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s, color 0.3s; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; }
        .m3-ripple { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; }
        .ripple-circle { position: absolute; border-radius: 50%; background-color: rgba(128, 128, 128, 0.2); transform: scale(0); animation: ripple-anim 0.3s cubic-bezier(0.2, 0, 0, 1); pointer-events: none; }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
        .top-app-bar { height: 64px; background-color: var(--bg-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
        .top-app-bar .title { font-size: 22px; font-weight: 400; color: var(--text-main); }
        .icon-btn { width: 48px; height: 48px; border-radius: 50%; color: var(--text-sub); transition: background-color 0.2s; }
        .icon-btn:hover { background-color: var(--surface-variant); }
        .container { flex: 1; width: 100%; max-width: 840px; margin: 0 auto; padding: 32px 24px; }
        @media (max-width: 600px) { .container { padding: 24px 16px; } }
        .headline-medium { font-size: 28px; font-weight: 400; line-height: 36px; margin-bottom: 8px; color: var(--text-main); }
        .body-large { font-size: 16px; font-weight: 400; line-height: 24px; color: var(--text-sub); margin-bottom: 32px; }
        .title-medium { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .desc { font-size: 14px; color: var(--text-sub); margin-top: 2px; }
        .account-card { background-color: var(--surface); border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; transition: background-color 0.3s; }
        .account-info { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background-color: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; }
        .btn-tonal { background-color: var(--surface-variant); color: var(--text-main); height: 40px; padding: 0 24px; border-radius: 9999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .btn-tonal:hover { background-color: var(--outline-variant); }
        .list-group { background-color: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 32px; transition: background-color 0.3s; }
        .list-item { display: flex; align-items: center; gap: 16px; height: 72px; padding: 0 16px; border-bottom: 1px solid var(--outline-variant); transition: background-color 0.2s; }
        .list-item:last-child { border-bottom: none; }
        .list-item .icon-wrap { width: 40px; height: 40px; border-radius: 50%; background-color: var(--surface-variant); color: var(--text-main); display: flex; align-items: center; justify-content: center; }
        .list-item .text-content { flex: 1; }
        .list-item .material-symbols-outlined.chevron { color: var(--text-sub); }
        .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px;}
        .btn-text { color: var(--primary); height: 40px; padding: 0 16px; border-radius: 9999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .btn-text:hover { background-color: var(--surface-variant); }
        .btn-text.danger { color: var(--error); }
        @media (max-width: 600px) { .top-app-bar { display: none; } .account-card { flex-direction: column; align-items: flex-start; } .account-card .btn-tonal { width: 100%; } }
    </style>
</head>
<body>

    <header class="top-app-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="/" class="icon-btn m3-ripple"><span class="material-symbols-outlined">arrow_back</span></a>
            <div class="title">应用大厅</div>
        </div>
        <a href="/account/" class="icon-btn m3-ripple"><span class="material-symbols-outlined">settings</span></a>
    </header>

    <main class="container">
        <h1 class="headline-medium">Talkroom 中枢</h1>
        <p class="body-large">管理你的社交、群组和 AI 交互，或者前往其他服务模块。</p>

        <div class="account-card">
            <div class="account-info">
                <div class="avatar" id="avatarInitial">?</div>
                <div>
                    <div class="title-medium">当前账号：<span id="userNameDisplay">加载中...</span></div>
                    <div class="desc">已通过安全认证</div>
                </div>
            </div>
            <a href="#" class="btn-tonal m3-ripple" id="logoutBtn">
                <span class="material-symbols-outlined" style="font-size: 18px; margin-right: 8px;">logout</span>退出登录
            </a>
        </div>

        <div class="list-group">
            <a href="/talkroom/chat/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">forum</span></div>
                <div class="text-content">
                    <div class="title-medium">公共聊天室</div>
                    <div class="desc">加入大厅与所有人畅聊，召唤 AI 助手</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>
            <a href="/talkroom/private/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">chat_bubble</span></div>
                <div class="text-content">
                    <div class="title-medium">一对一私信</div>
                    <div class="desc">寻找在线好友，发送加密私密消息</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>
            <a href="/talkroom/my-messages/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">history</span></div>
                <div class="text-content">
                    <div class="title-medium">我的消息记录</div>
                    <div class="desc">查看你发送过的历史消息</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>
        </div>

        <h2 class="title-medium" style="margin-bottom: 8px;">其他服务</h2>
        <div class="quick-actions">
            <a href="/community/" class="btn-text m3-ripple">前往社区</a>
            <a href="/gs/" class="btn-text m3-ripple">游戏中心</a>
            <a href="/care/" class="btn-text m3-ripple">心理关怀</a>
            <a href="/talkroom/admin/" class="btn-text danger m3-ripple">管理后台</a>
        </div>
    </main>

    <script>
        document.addEventListener('click', function(e) {
            const target = e.target.closest('.m3-ripple');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const circle = document.createElement('span');
            circle.classList.add('ripple-circle');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = size + 'px';
            circle.style.left = (x - size / 2) + 'px';
            circle.style.top = (y - size / 2) + 'px';
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 300);
        });

        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_KEY;

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage }
        });

        async function loadUserInfo() {
            // 【最新逻辑】直接问官方 SDK 拿真实登录状态，不再查本地手写的那个变量
            const { data: { session } } = await db.auth.getSession();
            
            if (!session || !session.user) {
                window.location.href = `/account/login/?redirect=${encodeURIComponent(window.location.pathname)}`;
                return;
            }

            // 如果拿到了 Session，拿它的 ID 去数据库查名字
            const { data: profile } = await db.from("profiles").select("username").eq("id", session.user.id).maybeSingle();
            // 如果数据库查不到，至少拿个邮箱前缀兜底
            const name = profile ? profile.username : (session.user.email.split('@')[0] || "未命名用户");
            
            document.getElementById("userNameDisplay").textContent = name;
            if (name && name.length > 0) {
                document.getElementById("avatarInitial").textContent = name.charAt(0).toUpperCase();
            }

            document.getElementById("logoutBtn").addEventListener("click", async (e) => {
                e.preventDefault();
                if(confirm("确定要退出登录吗？")) {
                    await db.auth.signOut();
                    localStorage.clear(); // 确保清空所有 SDK 的 token
                    sessionStorage.clear();
                    window.location.href = "/account/login/";
                }
            });
        }

        loadUserInfo();
    </script>
</body>
</html>
