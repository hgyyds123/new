<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="preload" href="/material-symbols.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 400; font-display: block; src: url('/material-symbols.woff2') format('woff2'); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; }
</style>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用大厅 · hg</title>
    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root { --bg-color: #F8F9FA; --surface: #FFFFFF; --surface-variant: #F0F4F9; --text-main: #1F1F1F; --text-sub: #444746; --outline-variant: #C4C7C5; --primary: #0b57d0; --on-primary: #FFFFFF; --primary-container: #d3e3fd; --on-primary-container: #041e49; --error: #B3261E; }
        @media (prefers-color-scheme: dark) { :root { --bg-color: #131314; --surface: #1E1F20; --surface-variant: #282A2C; --text-main: #E3E3E3; --text-sub: #C4C7C5; --outline-variant: #444746; --primary: #A8C7FA; --on-primary: #062E6F; --primary-container: #0842A0; --on-primary-container: #D3E3FD; --error: #F2B8B5; } }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Roboto', 'Noto Sans SC', sans-serif; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s, color 0.3s; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; }
        .m3-ripple { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; }
        .ripple-circle { position: absolute; border-radius: 50%; background-color: rgba(128, 128, 128, 0.2); transform: scale(0); animation: ripple-anim 0.3s cubic-bezier(0.2, 0, 0, 1); pointer-events: none; }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
        .top-app-bar { height: 64px; background-color: var(--bg-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
        .top-app-bar .title { font-size: 22px; font-weight: 400; color: var(--text-main); }
        .icon-btn { width: 48px; height: 48px; border-radius: 50%; color: var(--text-sub); transition: background-color 0.2s; }
        .icon-btn:hover { background-color: var(--surface-variant); }
        .container { flex: 1; width: 100%; max-width: 840px; margin: 0 auto; padding: 32px 24px; }
        @media (max-width: 600px) { .container { padding: 24px 16px; } }
        .headline-medium { font-size: 28px; font-weight: 400; line-height: 36px; margin-bottom: 8px; color: var(--text-main); }
        .body-large { font-size: 16px; font-weight: 400; line-height: 24px; color: var(--text-sub); margin-bottom: 32px; }
        .title-medium { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .desc { font-size: 14px; color: var(--text-sub); margin-top: 2px; }
        .account-card { background-color: var(--surface); border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; transition: background-color 0.3s; }
        .account-info { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background-color: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; }
        .btn-tonal { background-color: var(--surface-variant); color: var(--text-main); height: 40px; padding: 0 24px; border-radius: 9999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .btn-tonal:hover { background-color: var(--outline-variant); }
        .list-group { background-color: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 32px; transition: background-color 0.3s; }
        .list-item { display: flex; align-items: center; gap: 16px; height: 72px; padding: 0 16px; border-bottom: 1px solid var(--outline-variant); transition: background-color 0.2s; }
        .list-item:last-child { border-bottom: none; }
        .list-item .icon-wrap { width: 40px; height: 40px; border-radius: 50%; background-color: var(--surface-variant); color: var(--text-main); display: flex; align-items: center; justify-content: center; }
        .list-item .text-content { flex: 1; }
        .list-item .material-symbols-outlined.chevron { color: var(--text-sub); }
        .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px;}
        .btn-text { color: var(--primary); height: 40px; padding: 0 16px; border-radius: 9999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; transition: background-color 0.2s; }
        .btn-text:hover { background-color: var(--surface-variant); }
        .btn-text.danger { color: var(--error); }
        .notif-badge { background: var(--error); color: #FFFFFF; border-radius: 9px; font-size: 11px; padding: 1px 6px; margin-left: 2px; vertical-align: middle; }
        .notif-badge:empty { display: none; }
        .notif-panel { position: fixed; top: 68px; right: 16px; width: 320px; max-height: 360px; overflow-y: auto; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 200; padding: 8px; }
        .notif-toast { position: fixed; top: 72px; right: 16px; background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 150; opacity: 0; transform: translateX(20px); transition: all 0.25s ease; cursor: pointer; max-width: 280px; }
        .notif-toast.show { opacity: 1; transform: translateX(0); }
        .notif-item { padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
        .notif-item:hover { background: var(--surface-variant); }
        .notif-empty { text-align: center; color: var(--text-sub); padding: 24px 0; font-size: 13px; }
        @media (max-width: 600px) { .top-app-bar { display: none; } .account-card { flex-direction: column; align-items: flex-start; } .account-card .btn-tonal { width: 100%; } .notif-panel { top: 58px; right: 8px; width: calc(100vw - 16px); } }
    </style>
</head>
<body>

    <header class="top-app-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="/" class="icon-btn m3-ripple"><span class="material-symbols-outlined">arrow_back</span></a>
            <div class="title">应用大厅</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button class="icon-btn m3-ripple" id="notifBtn" style="display:none;"><span class="material-symbols-outlined">notifications</span><span id="notifBadge" class="notif-badge"></span></button>
            <a href="/account/" class="icon-btn m3-ripple"><span class="material-symbols-outlined">settings</span></a>
        </div>
    </header>

    <!-- 通知面板 -->
    <div class="notif-panel" id="notifPanel" style="display:none;"></div>

    <main class="container">
        <h1 class="headline-medium">Talkroom 中枢</h1>
        <p class="body-large">管理你的社交、群组和 AI 交互，或者前往其他服务模块。</p>

        <div class="account-card">
            <div class="account-info">
                <div class="avatar" id="avatarInitial">?</div>
                <div>
                    <div class="title-medium">当前账号：<span id="userNameDisplay">加载中...</span></div>
                    <div class="desc">已通过安全认证</div>
                </div>
            </div>
            <a href="#" class="btn-tonal m3-ripple" id="logoutBtn">
                <span class="material-symbols-outlined" style="font-size: 18px; margin-right: 8px;">logout</span>退出登录
            </a>
        </div>

        <div class="list-group">
            <a href="/talkroom/chat/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">forum</span></div>
                <div class="text-content">
                    <div class="title-medium">公共聊天室</div>
                    <div class="desc">加入大厅与所有人畅聊，召唤 AI 助手</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>
            <a href="/talkroom/private/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">chat_bubble</span></div>
                <div class="text-content">
                    <div class="title-medium">一对一私信</div>
                    <div class="desc">寻找在线好友，发送加密私密消息</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>
            <a href="/talkroom/my-messages/" class="list-item m3-ripple">
                <div class="icon-wrap"><span class="material-symbols-outlined">history</span></div>
                <div class="text-content">
                    <div class="title-medium">我的消息记录</div>
                    <div class="desc">查看你发送过的历史消息</div>
                </div>
                <span class="material-symbols-outlined chevron">chevron_right</span>
            </a>
        </div>

        <h2 class="title-medium" style="margin-bottom: 8px;">其他服务</h2>
        <div class="quick-actions">
            <a href="/community/" class="btn-text m3-ripple">前往社区</a>
            <a href="/gs/" class="btn-text m3-ripple">游戏中心</a>
            <a href="/care/" class="btn-text m3-ripple">心理关怀</a>
            <a href="/talkroom/admin/" class="btn-text danger m3-ripple">管理后台</a>
        </div>
    </main>

    <script>
        document.addEventListener('click', function(e) {
            const target = e.target.closest('.m3-ripple');
            if (!target) return;
            const rect = target.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const circle = document.createElement('span');
            circle.classList.add('ripple-circle');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = size + 'px';
            circle.style.left = (x - size / 2) + 'px';
            circle.style.top = (y - size / 2) + 'px';
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 300);
        });

        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_KEY;

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage }
        });

        // 头像上传
        const avatarInput = document.createElement('input');
        avatarInput.type = 'file'; avatarInput.accept = 'image/*'; avatarInput.style.display = 'none';
        document.body.appendChild(avatarInput);
        document.getElementById('avatarInitial').onclick = () => avatarInput.click();

        avatarInput.onchange = async (e) => {
            const file = e.target.files[0];
            const { data: { session } } = await db.auth.getSession();
            if (!file || !session || !session.user) return;
            
            const fileName = `avatars/${session.user.id}/${Date.now()}_${file.name}`;
            const { data, error } = await db.storage.from('community').upload(fileName, file, { upsert: true });
            if (error) { alert('上传失败：' + error.message); return; }
            
            const url = `${SUPABASE_URL}/storage/v1/object/public/community/${fileName}`;
            const patch = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${session.user.id}`, {
                method: 'PATCH',
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
                body: JSON.stringify({ avatar_url: url })
            });
            const patchRows = await patch.json().catch(() => null);
            if (patch.ok && Array.isArray(patchRows) && patchRows.length > 0) {
                applyAvatar(url);
                alert('头像更新成功');
            } else if (patch.ok) {
                alert('保存失败：请在 Supabase SQL Editor 执行 setup_follows.sql 的 profiles_update 策略');
            } else { alert('更新失败(' + patch.status + ')'); }
        };

        async function loadAvatar(userId) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=avatar_url`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                if (data && data.length > 0 && data[0].avatar_url) {
                    applyAvatar(data[0].avatar_url);
                }
            } catch(e) {}
        }

        function applyAvatar(url) {
            const el = document.getElementById('avatarInitial');
            el.innerHTML = `<img src="${url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        }

        // 通知：Realtime 订阅 notifications 表
        let notifChannel = null;
        let unreadCount = 0;

        function startNotifRealtime(userId) {
            if (!userId || notifChannel) return;
            document.getElementById('notifBtn').style.display = "";

            notifChannel = db.channel('notifications-' + userId)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'notifications',
                    filter: `user_id=eq.${userId}`
                }, (payload) => {
                    unreadCount++;
                    updateBadge();
                    showToastNotification(payload.new);
                })
                .subscribe((status) => {
                    if (status !== 'SUBSCRIBED') {
                        console.warn('Notif Realtime status:', status);
                    }
                });

            // 初始化未读数
            fetch(`${SUPABASE_URL}/rest/v1/notifications?user_id=eq.${userId}&read_at=is.null&select=id`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            }).then(r => r.json()).then(arr => {
                if (Array.isArray(arr)) { unreadCount = arr.length; updateBadge(); }
            });
        }

        function updateBadge() {
            const badge = document.getElementById('notifBadge');
            if (badge) badge.textContent = unreadCount > 0 ? String(unreadCount) : "";
        }

        function showToastNotification(n) {
            if (document.getElementById('notifPanel').style.display === 'block') return;
            const toast = document.createElement('div');
            toast.className = 'notif-toast';
            const text = n.content || (n.type === 'reply' ? '回复了你' : n.type === 'like_post' ? '赞了你的帖子' : n.type === 'follow' ? '关注了你' : n.type === 'chat_msg' ? '发来私聊' : n.type === 'chat_request' ? '请求私聊' : '有新通知');
            toast.innerHTML = `<b>有人</b> ${text}`;
            toast.onclick = () => document.getElementById('notifBtn').click();
            document.body.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        document.getElementById('notifBtn').onclick = async () => {
            const panel = document.getElementById('notifPanel');
            if (panel.style.display === "none") {
                panel.style.display = "block";
                panel.innerHTML = '<div class="notif-empty">加载中...</div>';
                try {
                    const { data: { session } } = await db.auth.getSession();
                    if (!session || !session.user) return;
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/notifications?user_id=eq.${session.user.id}&order=created_at.desc&limit=20`, {
                        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                    });
                    const arr = await res.json();
                    if (!Array.isArray(arr) || arr.length === 0) {
                        panel.innerHTML = '<div class="notif-empty">暂无通知</div>';
                    } else {
                        panel.innerHTML =
                            `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 12px;"><b style="font-size:13px;">通知</b><span class="comment-like" onclick="markAllRead(event)">全部已读</span></div>` +
                            arr.map(n => {
                                const text = n.content || (n.type === 'reply' ? '回复了你的帖子' : n.type === 'like_post' ? '赞了你的帖子' : n.type === 'like_comment' ? '赞了你的评论' : n.type === 'follow' ? '关注了你' : n.type === 'mention' ? '提到了你' : n.type === 'chat_msg' ? '发来私聊' : n.type === 'chat_request' ? '请求私聊' : '有新动态');
                                return `<div class="notif-item"${n.read_at ? '' : ' style="background:var(--primary-container);"'}><b>有人</b> ${text}<br><span class="comment-time">${timeAgo(n.created_at)}</span></div>`;
                            }).join('');
                        unreadCount = 0; updateBadge();
                    }
                } catch (e) {
                    panel.innerHTML = '<div class="notif-empty">加载失败</div>';
                }
            } else {
                panel.style.display = "none";
            }
        };
        window.markAllRead = async (e, silent) => {
            if (e) e.stopPropagation();
            try {
                const { data: { session } } = await db.auth.getSession();
                if (!session || !session.user) return;
                await fetch(`${SUPABASE_URL}/rest/v1/notifications?user_id=eq.${session.user.id}&read_at=is.null`, {
                    method: "PATCH",
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ read_at: new Date().toISOString() })
                });
                unreadCount = 0; updateBadge();
            } catch (err) {}
        };
        
        function escapeHtml(str) {
            return String(str).replaceAll("&", "&").replaceAll("<", "<").replaceAll(">", ">").replaceAll('"', "\"").replaceAll("'", "'");
        }
        
        function timeAgo(s) {
            if (!s) return "";
            const d = new Date(s);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return "刚刚";
            if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
            if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
            if (diff < 172800) return "昨天";
            if (diff < 2592000) return Math.floor(diff / 86400) + " 天前";
            return d.toLocaleDateString("zh-CN");
        }

        async function loadUserInfo() {
            // 【最新逻辑】直接问官方 SDK 拿真实登录状态，不再查本地手写的那个变量
            const { data: { session } } = await db.auth.getSession();
            
            if (!session || !session.user) {
                window.location.href = `/account/login/?redirect=${encodeURIComponent(window.location.pathname)}`;
                return;
            }

            // 如果拿到了 Session，拿它的 ID 去数据库查名字
            const { data: profile } = await db.from("profiles").select("username").eq("id", session.user.id).maybeSingle();
            // 如果数据库查不到，至少拿个邮箱前缀兜底
            const name = profile ? profile.username : (session.user.email.split('@')[0] || "未命名用户");
            
            document.getElementById("userNameDisplay").textContent = name;
            if (name && name.length > 0) {
                document.getElementById("avatarInitial").textContent = name.charAt(0).toUpperCase();
            }
            
            // 加载已保存的头像
            await loadAvatar(session.user.id);
            
            // 启动通知 Realtime
            startNotifRealtime(session.user.id);

            document.getElementById("logoutBtn").addEventListener("click", async (e) => {
                e.preventDefault();
                if(confirm("确定要退出登录吗？")) {
                    await db.auth.signOut();
                    localStorage.clear(); // 确保清空所有 SDK 的 token
                    sessionStorage.clear();
                    window.location.href = "/account/login/";
                }
            });
        }

        loadUserInfo();
    </script>
</body>
</html>
