<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室 · hgt.l.cd</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 26px; color: #333; margin-bottom: 8px; }

        .status {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
            min-height: 20px;
        }

        .status span { color: #667eea; font-weight: 600; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            background: #667eea;
            color: #fff;
            text-decoration: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover { background: #5568d3; transform: translateY(-2px); }

        .btn.secondary {
            background: #f0f2f8;
            color: #555;
        }

        .btn.secondary:hover { background: #e4e7f0; }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💬 聊天室</h1>
        <div class="status" id="status">检查登录状态…</div>

        <div class="btn-group">
            <a href="/talkroom/chat/" class="btn">进入聊天室</a>
            <a href="/talkroom/private/" class="btn secondary">私聊</a>
            <a href="/talkroom/admin/" class="btn secondary">管理后台</a>
            <a href="/talkroom/login/" class="btn secondary" id="loginBtn">登录 / 切换账号</a>
        </div>

        <div class="footer">hgt.l.cd · 聊天室</div>
    </div>

    <script>
        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmenl3b3N3dWVxY3h5b3B1cGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Nzg1NjIsImV4cCI6MjEwNTA1NDU2Mn0.WS1bxTcLiq1vZcCmmnGAoTtMJ04vWu0CAsZZLLUtvzU";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        const statusEl = document.getElementById("status");
        const loginBtn = document.getElementById("loginBtn");

        async function checkLogin() {
            const { data: { session } } = await db.auth.getSession();

            if (!session || !session.user) {
                statusEl.innerHTML = '当前未登录';
                loginBtn.textContent = "登录 / 注册";
                return;
            }

            const { data: profile } = await db
                .from("profiles")
                .select("username")
                .eq("id", session.user.id)
                .maybeSingle();

            const username = profile ? profile.username : "未知用户";
            statusEl.innerHTML = `已登录：<span>${escapeHtml(username)}</span>`;
            loginBtn.textContent = "切换账号";
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        checkLogin();
    </script>
</body>
</html>
