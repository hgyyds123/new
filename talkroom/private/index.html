<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私聊 · hg 聊天室</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #F8F9FA; --surface: #FFFFFF; --surface-variant: #F0F4F9;
            --text-main: #1F1F1F; --text-sub: #444746; --outline-variant: #C4C7C5;
            --primary: #0b57d0; --on-primary: #FFFFFF; --primary-container: #d3e3fd;
            --on-primary-container: #041e49; --error: #B3261E;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #131314; --surface: #1E1F20; --surface-variant: #282A2C;
                --text-main: #E3E3E3; --text-sub: #C4C7C5; --outline-variant: #444746;
                --primary: #A8C7FA; --on-primary: #062E6F; --primary-container: #0842A0;
                --on-primary-container: #D3E3FD; --error: #F2B8B5;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Roboto', 'Noto Sans SC', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; background: none; cursor: pointer; }

        .top-bar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background-color: var(--bg-color); border-bottom: 1px solid var(--outline-variant); flex-shrink: 0; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: background 0.2s; }
        .icon-btn:hover { background-color: var(--surface-variant); }
        .brand { font-size: 20px; font-weight: 500; }

        .layout { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; overflow: hidden; }

        .sidebar { width: 280px; background-color: var(--bg-color); border-right: 1px solid var(--outline-variant); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 16px 24px; font-size: 14px; font-weight: 500; color: var(--text-sub); border-bottom: 1px solid var(--outline-variant); }
        .online-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
        
        .user-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
        .user-item:hover { background-color: var(--surface-variant); }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; background-color: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; }
        .user-name { font-size: 15px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-item.me { opacity: 0.5; cursor: default; }
        .user-item.me:hover { background-color: transparent; }

        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-color); position: relative; min-width: 0; }
        .chat-header-bar { height: 64px; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid var(--outline-variant); }
        .chat-header-bar h2 { font-size: 18px; font-weight: 500; }
        
        .status-tip { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 15px; color: var(--text-sub); background-color: var(--surface-variant); padding: 16px 24px; border-radius: 16px; }

        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .msg-bubble { display: flex; flex-direction: column; max-width: 75%; align-self: flex-start; }
        .msg-bubble.mine { align-self: flex-end; align-items: flex-end; }
        .msg-name { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; padding: 0 4px; }
        .msg-content { background-color: var(--surface); padding: 12px 16px; border-radius: 4px 16px 16px 16px; font-size: 15px; line-height: 1.5; color: var(--text-main); word-break: break-word; border: 1px solid var(--outline-variant); }
        .msg-bubble.mine .msg-content { background-color: var(--primary); color: var(--on-primary); border: none; border-radius: 16px 4px 16px 16px; }

        .input-area { padding: 16px 24px; background-color: var(--bg-color); border-top: 1px solid var(--outline-variant); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .input-area input { flex: 1; height: 48px; background-color: var(--surface); border: 1px solid var(--outline-variant); border-radius: 24px; padding: 0 20px; font-size: 15px; color: var(--text-main); outline: none; transition: border-color 0.2s; }
        .input-area input:focus { border-color: var(--primary); }
        .send-btn { width: 48px; height: 48px; border-radius: 50%; background-color: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s; }
        .send-btn:hover { opacity: 0.9; }

        .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 9999; }
        .request-toast { background-color: var(--surface); border: 1px solid var(--outline-variant); border-radius: 16px; padding: 16px; width: 280px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); animation: slideInRight 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; gap: 12px; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .toast-header { display: flex; align-items: center; gap: 12px; }
        .toast-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary-container); color: var(--on-primary-container); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; }
        .toast-title { font-size: 15px; font-weight: 500; flex: 1; }
        .toast-desc { font-size: 13px; color: var(--text-sub); }
        .toast-actions { display: flex; gap: 8px; margin-top: 4px; }
        .toast-actions button { flex: 1; height: 36px; border-radius: 18px; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .btn-accept { background-color: var(--primary); color: var(--on-primary); }
        .btn-accept:hover { opacity: 0.9; }
        .btn-reject { background-color: var(--surface-variant); color: var(--text-main); }
        .btn-reject:hover { background-color: var(--outline-variant); }

        @media (max-width: 900px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; height: 180px; border-right: none; border-bottom: 1px solid var(--outline-variant); }
            .chat-container { height: calc(100vh - 180px - 64px); }
            .toast-container { bottom: 12px; right: 12px; left: 12px; align-items: center; }
            .request-toast { width: 100%; max-width: 400px; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="nav-left">
            <a href="/talkroom/" class="icon-btn"><span class="material-symbols-outlined">arrow_back</span></a>
            <div class="brand">私聊</div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">在线用户</div>
            <div class="online-list" id="onlineList"></div>
        </aside>

        <main class="chat-container">
            <div class="chat-header-bar">
                <h2 id="chatHeader">选择一个用户开始聊天</h2>
            </div>
            <div class="status-tip" id="statusTip">加载中…</div>
            <div class="messages" id="messages" style="display:none;"></div>
            <div class="input-area" id="inputArea" style="display:none;">
                <input type="text" id="msgInput" placeholder="输入消息..." maxlength="100" autocomplete="off">
                <button class="send-btn" id="sendBtn"><span class="material-symbols-outlined">send</span></button>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "sb_publishable__aIeUQuHcERXr2KUj6KQuA_UkCYMw8p";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        const statusTip = document.getElementById("statusTip");
        const onlineList = document.getElementById("onlineList");
        const toastContainer = document.getElementById("toastContainer");
        const messagesEl = document.getElementById("messages");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatHeader = document.getElementById("chatHeader");
        const inputArea = document.getElementById("inputArea");

        let myUserId = null;
        let myUsername = null;
        let otherUserId = null;
        let otherUsername = null;
        let currentConversationId = null;
        let msgChannel = null;
        let presenceChannel = null;

        async function init() {
            // 【终极防线】直接读 localStorage，不查网络，杜绝横跳
            const isLoggedIn = localStorage.getItem("hg_logged_in") === "true";
            const myUserIdLocal = localStorage.getItem("hg_user_id");
            const myUsernameLocal = localStorage.getItem("hg_username");

            if (!isLoggedIn || !myUserIdLocal) {
                const currentPath = window.location.pathname;
                window.location.href = `/account/login/?redirect=${encodeURIComponent(currentPath)}`;
                return;
            }

            myUserId = myUserIdLocal;
            myUsername = myUsernameLocal || "我";

            statusTip.textContent = `你是 ${myUsername}，点击左侧名字发起私聊`;
            if (window.innerWidth <= 900) statusTip.textContent = "下拉查看在线用户";

            initPresence();
            listenRequests();

            const savedConvId = localStorage.getItem("private_conv_id") || sessionStorage.getItem("private_conv_id");
            const savedOtherName = localStorage.getItem("private_other_name") || sessionStorage.getItem("private_other_name");
            const savedOtherId = localStorage.getItem("private_other_id") || sessionStorage.getItem("private_other_id");

            if (savedConvId && savedOtherName && savedOtherId) {
                currentConversationId = savedConvId;
                otherUsername = savedOtherName;
                otherUserId = savedOtherId;
                openChat();
            }
        }

        function initPresence() {
            presenceChannel = db.channel("talkroom-presence", { config: { presence: { key: myUserId } } });
            presenceChannel
                .on("presence", { event: "sync" }, () => {
                    const state = presenceChannel.presenceState();
                    const users = [];
                    Object.values(state).flat().forEach(p => {
                        if (p.user_id && p.user_id !== myUserId) {
                            users.push({ id: p.user_id, name: p.username });
                        }
                    });
                    renderOnline(users);
                })
                .subscribe(async (status) => {
                    if (status === "SUBSCRIBED") {
                        await presenceChannel.track({ user_id: myUserId, username: myUsername });
                    }
                });
        }

        function renderOnline(users) {
            const seen = new Set();
            const unique = users.filter(u => { if (seen.has(u.id)) return false; seen.add(u.id); return true; });
            onlineList.innerHTML = `<div class="user-item me"><div class="user-avatar">${myUsername.charAt(0).toUpperCase()}</div><div class="user-name">${escapeHtml(myUsername)} (我)</div></div>`;
            if (unique.length === 0) {
                onlineList.innerHTML += '<div style="font-size:13px;color:var(--text-sub);text-align:center;padding:20px;">暂无其他人在线</div>';
                return;
            }
            unique.forEach(u => {
                const div = document.createElement("div");
                div.className = "user-item";
                div.innerHTML = `<div class="user-avatar">${u.name.charAt(0).toUpperCase()}</div><div class="user-name">${escapeHtml(u.name)}</div>`;
                div.addEventListener("click", () => sendChatRequest(u.id, u.name));
                onlineList.appendChild(div);
            });
        }

        async function sendChatRequest(targetId, targetName) {
            statusTip.style.display = "block";
            statusTip.textContent = `正在向 ${targetName} 发起请求…`;
            const { data: existing } = await db.from("chat_requests").select("id").eq("from_user", myUserId).eq("to_user", targetId).eq("status", "pending").maybeSingle();
            if (existing) {
                statusTip.textContent = `等待 ${targetName} 回应…`;
                listenRequestStatus(existing.id, targetId, targetName);
                return;
            }
            const { data: newReq, error } = await db.from("chat_requests").insert({ from_user: myUserId, to_user: targetId, status: "pending" }).select().single();
            if (error) { console.error(error); statusTip.textContent = "发起请求失败"; }
            else { statusTip.textContent = `等待 ${targetName} 回应…`; listenRequestStatus(newReq.id, targetId, targetName); }
        }

        function listenRequestStatus(requestId, targetId, targetName) {
            const ch = db.channel("req-status-" + requestId)
                .on("postgres_changes", { event: "UPDATE", schema: "public", table: "chat_requests", filter: `id=eq.${requestId}` }, async (payload) => {
                    const status = payload.new.status;
                    if (status === "accepted") {
                        statusTip.textContent = `${targetName} 同意了，正在进入…`;
                        otherUserId = targetId; otherUsername = targetName;
                        await db.removeChannel(ch); await enterConversation();
                    } else if (status === "rejected") {
                        statusTip.textContent = `${targetName} 拒绝了你的请求`;
                        await db.removeChannel(ch);
                    }
                }).subscribe();
        }

        function listenRequests() {
            db.channel("chat-requests-" + myUserId)
                .on("postgres_changes", { event: "INSERT", schema: "public", table: "chat_requests", filter: `to_user=eq.${myUserId}` }, (payload) => {
                    const req = payload.new;
                    db.from("profiles").select("username").eq("id", req.from_user).maybeSingle().then(({ data }) => {
                        showToast(req.id, req.from_user, data ? data.username : "某人");
                    });
                }).subscribe();
        }

        function showToast(requestId, fromId, fromName) {
            const toast = document.createElement("div");
            toast.className = "request-toast";
            toast.id = "toast-" + requestId;
            toast.innerHTML = `
                <div class="toast-header">
                    <div class="toast-avatar">${fromName.charAt(0).toUpperCase()}</div>
                    <div><div class="toast-title">${escapeHtml(fromName)}</div><div class="toast-desc">请求与你私聊</div></div>
                </div>
                <div class="toast-actions">
                    <button class="btn-reject">拒绝</button>
                    <button class="btn-accept">同意</button>
                </div>
            `;
            toastContainer.appendChild(toast);
            toast.querySelector(".btn-accept").addEventListener("click", async () => {
                await db.from("chat_requests").update({ status: "accepted" }).eq("id", requestId);
                toast.remove(); otherUserId = fromId; otherUsername = fromName; await enterConversation();
            });
            toast.querySelector(".btn-reject").addEventListener("click", async () => {
                await db.from("chat_requests").update({ status: "rejected" }).eq("id", requestId);
                toast.remove();
            });
        }

        async function enterConversation() {
            const pairKey = [myUserId, otherUserId].sort().join("_");
            const { data: existing } = await db.from("conversations").select("id").eq("pair_key", pairKey).maybeSingle();
            if (existing) { currentConversationId = existing.id; }
            else {
                const { data: newConv, error: convErr } = await db.from("conversations").insert({ type: "private", pair_key: pairKey }).select().single();
                if (convErr || !newConv) return;
                currentConversationId = newConv.id;
                await db.from("conversation_members").insert([
                    { conversation_id: currentConversationId, user_id: myUserId },
                    { conversation_id: currentConversationId, user_id: otherUserId }
                ]);
            }
            openChat();
        }

        function openChat() {
            statusTip.style.display = "none";
            messagesEl.style.display = "flex";
            inputArea.style.display = "flex";
            chatHeader.textContent = `与 ${otherUsername} 的私聊`;
            localStorage.setItem("private_conv_id", currentConversationId);
            localStorage.setItem("private_other_name", otherUsername);
            localStorage.setItem("private_other_id", otherUserId);
            loadHistory();
            subscribeMessages();
        }

        async function loadHistory() {
            const { data, error } = await db.from("messages").select("*").eq("conversation_id", currentConversationId).order("created_at", { ascending: true });
            if (error) return;
            messagesEl.innerHTML = "";
            if (data.length === 0) messagesEl.innerHTML = '<div style="text-align:center;font-size:13px;color:var(--text-sub);margin-top:20px;">还没有消息，打个招呼吧</div>';
            else data.forEach(renderMessage);
            scrollToBottom();
        }

        async function subscribeMessages() {
            if (msgChannel) await db.removeChannel(msgChannel);
            msgChannel = db.channel("private-" + currentConversationId + "-" + Date.now())
                .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
                    if (payload.new.conversation_id !== currentConversationId) return;
                    if (messagesEl.innerHTML.includes("还没有消息")) messagesEl.innerHTML = "";
                    renderMessage(payload.new);
                    scrollToBottom();
                }).subscribe();
        }

        function renderMessage(row) {
            const isMine = row.user_id === myUserId;
            const div = document.createElement("div");
            div.className = `msg-bubble ${isMine ? 'mine' : ''}`;
            div.innerHTML = `<div class="msg-name">${isMine ? '我' : escapeHtml(row.nickname || "对方")}</div><div class="msg-content">${escapeHtml(row.content)}</div>`;
            messagesEl.appendChild(div);
        }

        function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !currentConversationId) return;
            msgInput.value = "";
            const { error } = await db.from("messages").insert({ content: text, nickname: myUsername, user_id: myUserId, conversation_id: currentConversationId });
            if (error) alert("发送失败");
        }

        function escapeHtml(str) {
            return String(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
        }

        init();
    </script>
</body>
</html>
