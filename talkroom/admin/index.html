<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · hgt.l.cd</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a2533 0%, #23303f 100%);
            min-height: 100vh;
            padding: 24px;
            color: #e3edf5;
        }

        .login-box {
            max-width: 360px;
            margin: 120px auto;
            background: #23303f;
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            border: 1px solid #3c4d62;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .login-box h1 { font-size: 22px; color: #c9def5; margin-bottom: 24px; }

        .login-box input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #3c4d62;
            border-radius: 50px;
            background: #1a2533;
            color: #e3edf5;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px;
        }

        .login-box input:focus { border-color: #667eea; }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-box button:hover { background: #5568d3; }

        .error { color: #e74c3c; font-size: 14px; margin-top: 12px; min-height: 20px; }

        .admin-panel { max-width: 800px; margin: 0 auto; display: none; }

        .admin-panel h1 {
            font-size: 24px;
            color: #c9def5;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: #23303f;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid #3c4d62;
        }

        .card h2 {
            font-size: 16px;
            color: #9bb4d0;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .online-tag {
            background: #2b405a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #b4d2f0;
            border: 1px solid #4f6b89;
        }

        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #2f4055;
            font-size: 14px;
        }

        .msg-row:last-child { border-bottom: none; }

        .msg-row .nick {
            color: #7bb3e6;
            font-weight: 600;
            min-width: 80px;
            flex-shrink: 0;
        }

        .msg-row .content {
            color: #c2d7ed;
            flex: 1;
            word-break: break-word;
        }

        .msg-row .time {
            color: #6a8099;
            font-size: 12px;
            flex-shrink: 0;
        }

        .empty { color: #6a8099; font-size: 14px; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <!-- 登录框 -->
    <div class="login-box" id="loginBox">
        <h1>🔒 管理后台</h1>
        <input type="password" id="pwd" placeholder="请输入管理员密码" autocomplete="off">
        <button id="loginBtn">进入</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <!-- 管理面板 -->
    <div class="admin-panel" id="adminPanel">
        <h1>🛠️ 管理后台</h1>

        <div class="card">
            <h2>🟢 当前在线（<span id="onlineCount">0</span> 人）</h2>
            <div class="online-list" id="onlineList">
                <span class="empty">暂无人在线</span>
            </div>
        </div>

        <div class="card">
            <h2>📜 所有消息记录</h2>
            <div id="msgList">
                <span class="empty">加载中…</span>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "hgyyds123456"; // 想改密码就改这里

        const SUPABASE_URL = "https://ufzywoswueqcxyopupjq.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmenl3b3N3dWVxY3h5b3B1cGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Nzg1NjIsImV4cCI6MjEwNTA1NDU2Mn0.WS1bxTcLiq1vZcCmmnGAoTtMJ04vWu0CAsZZLLUtvzU";

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginBox = document.getElementById("loginBox");
        const adminPanel = document.getElementById("adminPanel");
        const pwdInput = document.getElementById("pwd");
        const loginBtn = document.getElementById("loginBtn");
        const errorMsg = document.getElementById("errorMsg");

        function login() {
            if (pwdInput.value === ADMIN_PASSWORD) {
                loginBox.style.display = "none";
                adminPanel.style.display = "block";
                initAdmin();
            } else {
                errorMsg.textContent = "密码错误";
                pwdInput.value = "";
                pwdInput.focus();
            }
        }

        loginBtn.addEventListener("click", login);
        pwdInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") login();
        });

        function initAdmin() {
            // ===== 加载所有历史消息 =====
            loadAllMessages();

            // ===== 监听新消息 =====
            db.channel("admin-messages")
                .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
                    prependMessage(payload.new);
                })
                .subscribe();

            // ===== 监听在线状态 =====
            const presenceChannel = db.channel("messages-channel");
            presenceChannel
                .on("presence", { event: "sync" }, () => {
                    const state = presenceChannel.presenceState();
                    const names = Object.values(state).flat().map(p => p.nickname);
                    renderOnline(names);
                })
                .subscribe();
        }

        async function loadAllMessages() {
            const { data, error } = await db
                .from("messages")
                .select("*")
                .order("created_at", { ascending: false })
                .limit(200);

            if (error) {
                document.getElementById("msgList").innerHTML = '<span class="empty">加载失败</span>';
                return;
            }

            if (data.length === 0) {
                document.getElementById("msgList").innerHTML = '<span class="empty">还没有消息</span>';
                return;
            }

            const list = document.getElementById("msgList");
            list.innerHTML = "";
            data.forEach(row => appendMessage(row, list));
        }

        function appendMessage(row, container) {
            const div = document.createElement("div");
            div.className = "msg-row";
            const time = new Date(row.created_at).toLocaleString("zh-CN");
            div.innerHTML = `
                <span class="nick">${escapeHtml(row.nickname || "匿名")}</span>
                <span class="content">${escapeHtml(row.content)}</span>
                <span class="time">${time}</span>
            `;
            container.appendChild(div);
        }

        function prependMessage(row) {
            const list = document.getElementById("msgList");
            if (list.querySelector(".empty")) list.innerHTML = "";
            const div = document.createElement("div");
            div.className = "msg-row";
            const time = new Date(row.created_at).toLocaleString("zh-CN");
            div.innerHTML = `
                <span class="nick">${escapeHtml(row.nickname || "匿名")}</span>
                <span class="content">${escapeHtml(row.content)}</span>
                <span class="time">${time}</span>
            `;
            list.insertBefore(div, list.firstChild);
        }

        function renderOnline(names) {
            document.getElementById("onlineCount").textContent = names.length;
            const list = document.getElementById("onlineList");
            if (names.length === 0) {
                list.innerHTML = '<span class="empty">暂无人在线</span>';
            } else {
                list.innerHTML = names
                    .map(n => `<span class="online-tag">${escapeHtml(n)}</span>`)
                    .join("");
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }
    </script>
</body>
</html>
