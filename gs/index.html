<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>geo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff; --text-primary: #202124; --text-secondary: #5f6368;
            --accent-blue: #4285F4; --accent-hover: #3367D6; --border-color: #dadce0;
            --hover-bg: #f8f9fa; --radius-card: 16px; --radius-pill: 100px;
            --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-4: 32px; --space-5: 48px; --space-6: 64px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: var(--space-6) var(--space-3); line-height: 1.5; }
        .header { text-align: center; margin-bottom: var(--space-6); width: 100%; max-width: 600px; }
        .header h1 { font-size: 32px; font-weight: 400; letter-spacing: -0.5px; margin-bottom: var(--space-2); }
        
        .search-container { position: relative; width: 100%; margin-bottom: var(--space-5); display: flex; justify-content: center; }
        .search-wrapper { display: flex; align-items: center; width: 100%; max-width: 600px; height: 48px; border: 1px solid var(--border-color); border-radius: var(--radius-pill); padding: 0 var(--space-3); transition: box-shadow 0.2s, border-color 0.2s; background: var(--bg-color); }
        .search-wrapper:hover, .search-wrapper:focus-within { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: transparent; }
        .search-icon { fill: var(--text-secondary); width: 20px; height: 20px; margin-right: var(--space-2); }
        .search-input { flex: 1; border: none; outline: none; font-size: 16px; color: var(--text-primary); background: transparent; }
        .search-input::placeholder { color: var(--text-secondary); }

        .card-container { width: 100%; max-width: 600px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-card); box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15); overflow: hidden; }
        .game-item { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3); border-bottom: 1px solid var(--border-color); transition: background-color 0.2s; }
        .game-item:last-child { border-bottom: none; }
        .game-item:hover { background-color: var(--hover-bg); }
        .game-info { display: flex; align-items: center; gap: var(--space-2); }
        .game-icon { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: var(--hover-bg); border-radius: 50%; color: var(--accent-blue); flex-shrink: 0; }
        .game-icon svg { width: 24px; height: 24px; fill: currentColor; }
        .game-name { font-size: 16px; font-weight: 500; color: var(--text-primary); word-break: break-all; }
        .game-meta { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        .btn-group { display: flex; gap: var(--space-1); }
        .btn { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 var(--space-2); border-radius: var(--radius-pill); font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; transition: background-color 0.2s, box-shadow 0.2s; border: none; outline: none; user-select: none; white-space: nowrap; }
        .btn-secondary { background: transparent; color: var(--accent-blue); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: rgba(66, 133, 244, 0.04); }
        .btn-primary { background: var(--accent-blue); color: #ffffff; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 1px 3px 0 rgba(66,133,244,0.3), 0 4px 8px 3px rgba(66,133,244,0.15); }
        .btn:active { transform: scale(0.96); }
        .btn svg { width: 18px; height: 18px; fill: currentColor; }
        .empty-state { padding: var(--space-5); text-align: center; color: var(--text-secondary); font-size: 14px; }
        
        @media (max-width: 550px) { 
            .game-item { flex-direction: column; align-items: flex-start; gap: var(--space-2); } 
            .btn-group { width: 100%; justify-content: flex-end; } 
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>游戏下载中心</h1>
    </header>

    <div class="search-container">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="搜索游戏..." autocomplete="off">
        </div>
    </div>

    <main class="card-container" id="gameList"></main>

    <script>
        // ================= 配置区 =================
        
        // 1. 你的游戏列表（以后加新游戏，直接往下加一行就行了）
        const gameFiles = [
            { name: '中国行政区狙击游戏', title: '中国行政区狙击游戏', size: '156 KB' },
            { name: 'pt', title: '中国地形区拼图', size: '248 KB' }
            // { name: 'other-game', title: '其他游戏', size: '1.5 MB' }
        ]; 

        // 2. 下载站的基础路径（指向你搞定的 dl 域名）
        const downloadBasePath = 'https://dl.hg1.dpdns.org'; 
        
        // 3. “前往游玩”跳转的地址
        const playUrl = 'https://huawei.com';
        // ==========================================

        const listContainer = document.getElementById('gameList');
        const searchInput = document.getElementById('searchInput');
        let allGames = [];

        function renderList(gamesToRender) {
            listContainer.innerHTML = '';
            
            if (gamesToRender.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">未找到匹配的游戏</div>';
                return;
            }

            gamesToRender.forEach(game => {
                const item = document.createElement('div');
                item.className = 'game-item';
                const fileUrl = `${downloadBasePath}/${game.name}.swf`;
                
                item.innerHTML = `
                    <div class="game-info">
                        <div class="game-icon">
                            <svg viewBox="0 0 24 24"><path d="M21.58 16.09l-1.09-7.66C20.21 6.46 18.52 5 16.53 5H7.47C5.48 5 3.79 6.46 3.51 8.43l-1.09 7.66C2.2 17.63 3.39 19 4.94 19c.68 0 1.32-.27 1.8-.75L9 16h6l2.25 2.25c.48.48 1.13.75 1.8.75 1.56 0 2.75-1.37 2.53-2.91zM11 11H9v2H8v-2H6v-1h2V8h1v2h2v1zm4-1c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                        </div>
                        <div>
                            <div class="game-name">${game.title}</div>
                            <div class="game-meta">${game.size} · SWF 格式</div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <a href="${fileUrl}" download class="btn btn-secondary">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> 下载
                        </a>
                        <a href="${playUrl}" target="_blank" class="btn btn-primary">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 前往游玩
                        </a>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // 初始化
        allGames = gameFiles;
        renderList(allGames);

        // 搜索功能
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const filtered = allGames.filter(game => 
                game.title.toLowerCase().includes(keyword) || game.name.toLowerCase().includes(keyword)
            );
            renderList(filtered);
        });
    </script>
</body>
</html>
