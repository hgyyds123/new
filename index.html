<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到 hgt.l.cd</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 16px;
        }

        p {
            font-size: 16px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: #fff;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 28px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>👋 你好，世界！</h1>
        <p>这是我的个人网站，部署在 GitHub Pages 上。<br>域名是 hgt.l.cd。</p>
        <a href="https://github.com" class="btn" target="_blank">访问 GitHub</a>
        <div class="footer">© 2026 hgt.l.cd</div>
    </div>
</body>
</html>
