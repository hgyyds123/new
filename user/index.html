<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户主页 · hg</title>
<link rel="preload" href="/material-symbols.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 400; font-display: block; src: url('/material-symbols.woff2') format('woff2'); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; }
</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg-color: #F8F9FA; --surface: #FFFFFF; --surface-variant: #F0F4F9; --text-main: #1F1F1F; --text-sub: #444746; --outline-variant: #C4C7C5; --primary: #0b57d0; --on-primary: #FFFFFF; --primary-container: #d3e3fd; --error: #B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg-color: #131314; --surface: #1E1F20; --surface-variant: #282A2C; --text-main: #E3E3E3; --text-sub: #C4C7C5; --outline-variant: #444746; --primary: #A8C7FA; --on-primary: #062E6F; --primary-container: #0842A0; --error: #F2B8B5; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Roboto','Noto Sans SC',sans-serif; min-height: 100vh; display:flex;flex-direction:column; }
  .top-app-bar { height: 64px; background: var(--bg-color); display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--outline-variant); }
  .nav-left { display:flex;align-items:center;gap:12px; }
  .icon-btn { width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-sub);transition:background .2s; }
  .icon-btn:hover { background:var(--surface-variant); }
  .title { font-size:22px;font-weight:400;color:var(--text-main); }
  .container { flex:1;width:100%;max-width:900px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:24px; }
  .profile-card { background:var(--surface);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;border:1px solid var(--outline-variant); }
  .profile-avatar { width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:500; }
  .profile-name { font-size:24px;font-weight:600;margin-bottom:4px; }
  .profile-id { font-size:13px;color:var(--text-sub);margin-bottom:8px;word-break:break-all; }
  .profile-bio { font-size:14px;color:var(--text-main);max-width:600px; }
  .profile-stats { display:flex;gap:24px;margin-top:12px;font-size:13px;color:var(--text-sub); }
  .profile-stats b { color:var(--text-main);font-weight:600; }
  .profile-actions { display:flex;gap:8px;margin-top:12px;flex-wrap:wrap; }
  .btn-filled { background:var(--primary);color:var(--on-primary);border:none;border-radius:9999px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer; }
  .btn-filled:hover { opacity:0.9; }
  .btn-text { color:var(--primary);border:none;background:none;border-radius:9999px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer; }
  .btn-text:hover { background:var(--surface-variant); }
  .section-title { font-size:18px;font-weight:500;color:var(--text-main);display:flex;align-items:center;gap:8px; }
  .empty { text-align:center;color:var(--text-sub);padding:40px 0;font-size:14px; }
  .post-card { background:var(--surface);border-radius:12px;padding:16px;border:1px solid var(--outline-variant);margin-bottom:12px; }
  .post-title { font-size:16px;font-weight:600;margin-bottom:4px;color:var(--text-main); }
  .post-meta { font-size:12px;color:var(--text-sub);margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap; }
  .post-content { font-size:14px;color:var(--text-main);line-height:1.6; }
  .tabs { display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--outline-variant);padding-bottom:8px;overflow-x:auto; }
  .tab { padding:8px 12px;font-size:13px;font-weight:500;color:var(--text-sub);cursor:pointer;white-space:nowrap;position:relative; }
  .tab.active { color:var(--primary);border-bottom:2px solid var(--primary); }
  .tab:hover { color:var(--text-main); }
  @media(max-width:600px){ .container{padding:16px;} .profile-avatar{width:72px;height:72px;font-size:24px;} .profile-name{font-size:20px;} }
</style>
</head>
<body>

<header class="top-app-bar">
  <div class="nav-left">
    <a href="/" class="icon-btn m3-ripple"><span class="material-symbols-outlined">arrow_back</span></a>
    <div class="title">用户主页</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="icon-btn m3-ripple" id="notifBtn" style="display:none;"><span class="material-symbols-outlined">notifications</span><span id="notifBadge" class="notif-badge"></span></button>
    <a href="/account/" class="icon-btn m3-ripple"><span class="material-symbols-outlined">settings</span></a>
  </div>
</header>

<!-- 通知面板 -->
<div class="notif-panel" id="notifPanel" style="display:none;"></div>

<div class="container">
  <div class="profile-card">
    <div class="profile-avatar" id="profileAvatar">?</div>
    <div class="profile-name" id="profileName">加载中...</div>
    <div class="profile-id" id="profileId">...</div>
    <div class="profile-bio" id="profileBio">这个人很懒，什么都没有留下。</div>
    <div class="profile-stats">
      <span><b id="statPosts">0</b> 帖子</span>
      <span><b id="statVotes">0</b> 投票</span>
      <span><b id="statFollowers">0</b> 粉丝</span>
      <span><b id="statFollowing">0</b> 关注</span>
    </div>
    <div class="profile-actions" id="profileActions"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="posts">帖子</div>
    <div class="tab" data-tab="votes">投票</div>
    <div class="tab" data-tab="comments">评论</div>
  </div>

  <div id="content">
    <div class="empty">加载中...</div>
  </div>
</div>

<script>
    const SUPABASE_URL = CONFIG.SUPABASE_URL;
    const SUPABASE_KEY = CONFIG.SUPABASE_KEY;
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage }
    });

    // 统一通知铃铛
    window.__notif.init({
        supabaseUrl: SUPABASE_URL,
        supabaseKey: SUPABASE_KEY,
        db: db,
        userId: localStorage.getItem('hg_user_id') || sessionStorage.getItem('hg_user_id') || null
    });

    // 获取 URL 中的 userId
    const urlParams = new URLSearchParams(window.location.search);
    const profileUserId = urlParams.get('id');
    const myUserId = localStorage.getItem('hg_user_id') || sessionStorage.getItem('hg_user_id');

    let isAdmin = false;
    let profileData = null;

    async function init() {
        if (!profileUserId) {
            document.getElementById('content').innerHTML = '<div class="empty">用户不存在</div>';
            return;
        }

        // 拉取用户资料
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${profileUserId}&select=*`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            if (data && data.length > 0) {
                profileData = data[0];
                renderProfile(profileData);
                if (profileData.is_admin) isAdmin = true;
            } else {
                document.getElementById('content').innerHTML = '<div class="empty">用户不存在</div>';
                return;
            }
        } catch(e) {
            document.getElementById('content').innerHTML = '<div class="empty">加载失败</div>';
            return;
        }

        // 检查是否已关注
        if (myUserId) {
            try {
                const fr = await fetch(`${SUPABASE_URL}/rest/v1/follows?follower_id=eq.${myUserId}&followee_id=eq.${profileUserId}&select=id`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const fdata = await fr.json();
                document.getElementById('followStatus').dataset.following = Array.isArray(fdata) && fdata.length > 0 ? '1' : '0';
            } catch(e) {}
        }

        loadTabs();
    }

    function renderProfile(p) {
        document.getElementById('profileName').textContent = p.username || '匿名用户';
        document.getElementById('profileId').textContent = p.id;
        document.getElementById('profileBio').textContent = p.bio || '这个人很懒，什么都没有留下。';

        const avatarEl = document.getElementById('profileAvatar');
        if (p.avatar_url) {
            avatarEl.innerHTML = `<img src="${p.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else {
            avatarEl.textContent = (p.username || 'U').charAt(0).toUpperCase();
        }

        const actions = document.getElementById('profileActions');
        if (myUserId && myUserId !== p.id) {
            const following = document.getElementById('followStatus')?.dataset?.following === '1';
            actions.innerHTML = `
                <button class="${following ? 'btn-text' : 'btn-filled'}" id="followBtn" onclick="toggleFollowUser()">${following ? '已关注' : '关注 TA'}</button>
                <button class="btn-text" onclick="sendMessageToUser('${escapeHtml(p.username || p.id)}', '${p.id}')">发消息</button>
            `;
        } else if (myUserId === p.id) {
            actions.innerHTML = `<a href="/account/" class="btn-text">编辑资料</a>`;
        }
    }

    async function toggleFollowUser() {
        if (!myUserId) { window.location.href = `/account/login/?redirect=${encodeURIComponent(window.location.pathname)}`; return; }
        const btn = document.getElementById('followBtn');
        const following = btn.textContent === '已关注';
        try {
            let r;
            if (following) {
                r = await fetch(`${SUPABASE_URL}/rest/v1/follows?follower_id=eq.${myUserId}&followee_id=eq.${profileUserId}`, {
                    method: 'DELETE', headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
            } else {
                r = await fetch(`${SUPABASE_URL}/rest/v1/follows`, {
                    method: 'POST', headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "resolution=ignore-duplicates" },
                    body: JSON.stringify({ follower_id: myUserId, followee_id: profileUserId })
                });
            }
            if (r.ok || r.status === 409) {
                btn.textContent = following ? '关注 TA' : '已关注';
                btn.className = following ? 'btn-filled' : 'btn-text';
                document.getElementById('followStatus').dataset.following = following ? '0' : '1';
                // 更新统计
                if (!following) {
                    const fEl = document.getElementById('statFollowing'); fEl.textContent = String(parseInt(fEl.textContent || '0') + 1);
                }
            }
        } catch(e) { alert('操作失败'); }
    }

    async function sendMessageToUser(username, targetId) {
        if (!myUserId) { window.location.href = `/account/login/?redirect=${encodeURIComponent(window.location.pathname)}`; return; }
        // 跳转私聊，带上目标用户
        window.location.href = `/talkroom/private/?to=${encodeURIComponent(targetId)}&name=${encodeURIComponent(username)}`;
    }

    async function loadStats() {
        // 帖子数
        try {
            const { count } = await fetch(`${SUPABASE_URL}/rest/v1/posts?author_id=eq.${profileUserId}&select=count`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }).then(r=>r.json());
        } catch(e) {}
        // 粉丝/关注数
        try {
            const fr = await fetch(`${SUPABASE_URL}/rest/v1/follows?followee_id=eq.${profileUserId}&select=id`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
            const followers = await fr.json();
            document.getElementById('statFollowers').textContent = String(Array.isArray(followers) ? followers.length : 0);
            const ff = await fetch(`${SUPABASE_URL}/rest/v1/follows?follower_id=eq.${profileUserId}&select=id`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
            const following = await ff.json();
            document.getElementById('statFollowing').textContent = String(Array.isArray(following) ? following.length : 0);
        } catch(e) {}
    }

    async function loadTabs() {
        await loadStats();
        renderPosts();
    }

    async function renderPosts() {
        const content = document.getElementById('content');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?author_id=eq.${profileUserId}&order=created_at.desc&limit=50`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
            const posts = await res.json();
            if (!Array.isArray(posts) || posts.length === 0) {
                content.innerHTML = '<div class="empty">暂无帖子</div>';
                return;
            }
            let html = '<div style="display:flex;flex-direction:column;gap:12px;">';
            posts.forEach(p => {
                html += `
                <div class="post-card">
                    <div class="post-title">${escapeHtml(p.title || '无标题')}</div>
                    <div class="post-meta"><span>${timeAgo(p.created_at)}</span><span style="color:var(--error);margin-left:auto;">${(p.likes||[]).length} 赞</span></div>
                    <div class="post-content">${escapeHtml(p.content || '').slice(0, 200)}${ (p.content||'').length > 200 ? '...' : ''}</div>
                </div>`;
            });
            html += '</div>';
            content.innerHTML = html;
        } catch(e) {
            content.innerHTML = '<div class="empty">加载失败</div>';
        }
    }

    function escapeHtml(str) {
        return String(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
    }
    function timeAgo(s) {
        if (!s) return "";
        const d = new Date(s);
        const now = new Date();
        const diff = Math.floor((now - d) / 1000);
        if (diff < 60) return "刚刚";
        if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
        if (diff < 86400) return Math.floor(diff / 86400) + " 小时前";
        if (diff < 172800) return "昨天";
        if (diff < 2592000) return Math.floor(diff / 86400) + " 天前";
        return d.toLocaleDateString("zh-CN");
    }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const type = tab.dataset.tab;
            if (type === 'posts') renderPosts();
            else if (type === 'votes') renderVotes();
            else if (type === 'comments') renderComments();
        });
    });

    async function renderVotes() {
        const content = document.getElementById('content');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/votes?user_id=eq.${profileUserId}&order=created_at.desc&limit=50`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
            const votes = await res.json();
            if (!Array.isArray(votes) || votes.length === 0) { content.innerHTML = '<div class="empty">暂无投票</div>'; return; }
            let html = '<div style="display:flex;flex-direction:column;gap:12px;">';
            votes.forEach(v => {
                html += `<div class="post-card"><div class="post-title">${escapeHtml(v.title || '无标题')}</div><div class="post-meta"><span>${timeAgo(v.created_at)}</span></div></div>`;
            });
            html += '</div>';
            content.innerHTML = html;
        } catch(e) { content.innerHTML = '<div class="empty">加载失败</div>'; }
    }

    async function renderComments() {
        const content = document.getElementById('content');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?user_id=eq.${profileUserId}&order=created_at.desc&limit=50`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
            const comments = await res.json();
            if (!Array.isArray(comments) || comments.length === 0) { content.innerHTML = '<div class="empty">暂无评论</div>'; return; }
            let html = '<div style="display:flex;flex-direction:column;gap:12px;">';
            comments.forEach(c => {
                html += `<div class="post-card"><div class="post-content">${escapeHtml(c.content || '')}</div><div class="post-meta"><span>${timeAgo(c.created_at)}</span></div></div>`;
            });
            html += '</div>';
            content.innerHTML = html;
        } catch(e) { content.innerHTML = '<div class="empty">加载失败</div>'; }
    }

    init();
</script>
</body>
</html>
