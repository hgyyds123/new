<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 Flash 游戏</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>

    <!-- 1. 引入官方同款 CDN 脚本 -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    
    <!-- 2. 播放器。注意 src 必须完全等于你仓库里的文件名（区分大小写） -->
    <ruffle-player src="你的游戏文件名.swf" width="800" height="600"></ruffle-player>

</body>
</html>
