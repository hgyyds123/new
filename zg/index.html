<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>hg Flash 游戏</title>
    <style>
        /* 简单粗暴，直接让 body 居中 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* 强制规定播放器的宽高，杜绝 0x0 的情况 */
        ruffle-player {
            width: 800px !important;
            height: 600px !important;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <!-- 使用官方最新 CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    
    <!-- 记得确保游戏文件叫 game.swf，并且和这个 html 在同一个文件夹 -->
    <ruffle-player src="./game.swf"></ruffle-player>
</body>
</html>
