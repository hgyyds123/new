<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏 - zg</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #2c3e50;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            width: 100%; height: 100vh;
            max-width: 1024px; max-height: 768px;
        }
        ruffle-player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            // 保留 info 方便看日志
            logLevel: "info",
            // 只用这个国内 CDN 的思源黑体，速度极快！
            fontSources: ["https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/byted-fonts/1.0.1/SourceHanSansCN-Regular.otf"],
            defaultFonts: {
                sans: ["Source Han Sans CN", "Noto Sans SC", "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", "sans-serif"],
                serif: ["SimSun", "宋体", "serif"],
                typewriter: ["Courier New", "monospace"],
                "device": ["Source Han Sans CN", "Microsoft YaHei"]
            }
        };
    </script>

    <!-- 引入本地 ruffle -->
    <script src="./ruffle.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("game-container").appendChild(player);
            // 加载游戏
            player.ruffle().load("./zg.swf");
        });
    </script>
</body>
</html>
