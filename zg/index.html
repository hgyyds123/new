<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏 - zg</title>
    <style>
        /* 【关键修改 1】用浏览器原生的方式加载这个 ttf 文件 */
        @font-face {
            font-family: 'MyCustomFont';
            src: url('./msyh.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0; padding: 0;
            background-color: #2c3e50;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            width: 100%; height: 100vh;
            max-width: 1024px; max-height: 768px;
        }
        ruffle-player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script src="./ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        
        window.RufflePlayer.config = {
            logLevel: "info",
            // 【关键修改 2】把文件提供给 Ruffle
            fontSources: ["./msyh.ttf"],
            // 【关键修改 3】把游戏里可能请求的字体名，全权交给浏览器处理
            defaultFonts: {
                sans: ["MyCustomFont", "Microsoft YaHei", "微软雅黑", "sans-serif"],
                serif: ["MyCustomFont", "SimSun", "宋体", "serif"],
                typewriter: ["MyCustomFont", "Courier New", "monospace"],
                device: ["MyCustomFont", "Microsoft YaHei", "微软雅黑"]
            }
        };

        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("game-container").appendChild(player);
            player.ruffle().load("./zg.swf");
        });
    </script>
</body>
</html>
