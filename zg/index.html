<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏 - zg</title>
    <style>
        body { margin: 0; padding: 0; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-container { width: 100%; height: 100vh; max-width: 1024px; max-height: 768px; }
        ruffle-player { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            logLevel: "info",
            // 关键：把执行超时限制从默认值调大，给游戏充足的初始化时间
            maxExecutionDuration: 180 // 单位是秒，先给足 3 分钟
        };
    </script>
    <script src="./ruffle.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("game-container").appendChild(player);
            player.ruffle().load("./zg.swf");
        });
    </script>
</body>
</html>
