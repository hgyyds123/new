<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏 - zg</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #2c3e50;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container {
            width: 100%; height: 100vh;
            max-width: 1024px; max-height: 768px;
        }
        ruffle-player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script src="./ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        
        window.RufflePlayer.config = {
            logLevel: "info",
            // 指向你新上传的思源黑体
            fontSources: ["./NotoSansSC.ttf"],
            defaultFonts: {
                // 把游戏可能请求的中英文字体全映射过去
                sans: ["Noto Sans SC", "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", "PingFang SC", "sans-serif"],
                serif: ["SimSun", "宋体", "serif"],
                typewriter: ["Courier New", "monospace"],
                "device": ["Noto Sans SC", "Microsoft YaHei"]
            }
        };

        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("game-container").appendChild(player);
            player.ruffle().load("./zg.swf");
        });
    </script>
</body>
</html>
