<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看些别的</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 28px; color: #333; margin-bottom: 24px; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: #fff;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .back {
            margin-top: 24px;
            font-size: 14px;
        }

        .back a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>看些别的</h1>
        <div class="btn-group">
            <a href="http://hgt.l.cd/game" class="btn" target="_blank">游戏相关</a>
            <a href="http://hgt.l.cd/talkroom" class="btn" target="_blank">与在线的人聊天（测试版，不稳定）</a>
            <a href="/news/" class="btn">新闻</a>
            <a href="http://hgt.l.cd/updates" class="btn" target="_blank">更新日志</a>
            <a href="https://www.bilibili.com" class="btn" target="_blank">看会b站</a>
            <a href="http://hgt.l.cd" class="btn">返回首页</a>
        </div>
        <div class="back"><a href="/">← 返回 hgt.l.cd</a></div>
    </div>
</body>
</html>
