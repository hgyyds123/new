<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证 · hgt.l.cd</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 26px; color: #333; margin-bottom: 8px; }

        p.sub { font-size: 14px; color: #888; margin-bottom: 28px; }

        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.25s;
            margin-bottom: 16px;
        }

        input[type="password"]:focus { border-color: #667eea; }

        .btn {
            display: inline-block;
            background: #667eea;
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
        }

        .btn:hover { background: #5568d3; transform: translateY(-2px); }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 验证</h1>
        <p class="sub">请输入密码继续访问</p>
        <input type="password" id="pwd" placeholder="输入密码" autocomplete="off">
        <button class="btn" id="submitBtn">进入</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        const PASSWORD = "helloworld"; // 想改密码就改这里

        const pwdInput = document.getElementById("pwd");
        const submitBtn = document.getElementById("submitBtn");
        const errorMsg = document.getElementById("errorMsg");

        function check() {
            if (pwdInput.value === PASSWORD) {
                // ===== 验证成功：记录状态，并跳回原来想去的页面 =====
                sessionStorage.setItem("site_auth", "ok");

                const params = new URLSearchParams(location.search);
                const redirect = params.get("redirect") || "/";
                window.location.href = redirect;
            } else {
                errorMsg.textContent = "密码错误，请重试";
                pwdInput.value = "";
                pwdInput.focus();
            }
        }

        submitBtn.addEventListener("click", check);
        pwdInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") check();
        });
    </script>
</body>
</html>
