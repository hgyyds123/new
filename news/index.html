<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻 · hgt.l.cd</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            line-height: 1.8;
        }

        .container {
            max-width: 640px;
            width: 100%;
        }

        .header {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 26px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #999;
        }

        .news-item {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .news-item .date {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .news-item .title {
            font-size: 18px;
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .news-item .content {
            font-size: 15px;
            color: #555;
            line-height: 1.9;
        }

        .empty {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: #999;
            font-size: 15px;
        }

        .back {
            text-align: center;
            margin-top: 24px;
        }

        .back a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
        }

        .back a:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 新闻</h1>
            <p>hgt.l.cd 的最新动态</p>
        </div>

        <div id="newsList">
            <div class="empty">加载中…</div>
        </div>

        <div class="back">
            <a href="/">← 返回首页</a>
        </div>
    </div>

    <script>
        async function loadNews() {
            const list = document.getElementById("newsList");
            try {
                const res = await fetch("./news.txt?t=" + Date.now());
                if (!res.ok) throw new Error("找不到 news.txt");
                const text = await res.text();

                const lines = text.split("\n")
                    .map(l => l.trim())
                    .filter(l => l && !l.startsWith("#"));

                if (lines.length === 0) {
                    list.innerHTML = '<div class="empty">暂无新闻</div>';
                    return;
                }

                // 倒序显示，最新的在最上面
                const items = lines.map(line => {
                    const parts = line.split("|");
                    if (parts.length < 3) return null;
                    return {
                        date: parts[0],
                        title: parts[1],
                        content: parts.slice(2).join("|")
                    };
                }).filter(Boolean).reverse();

                if (items.length === 0) {
                    list.innerHTML = '<div class="empty">暂无新闻</div>';
                    return;
                }

                list.innerHTML = "";
                items.forEach(item => {
                    const div = document.createElement("div");
                    div.className = "news-item";
                    div.innerHTML = `
                        <div class="date">${escapeHtml(item.date)}</div>
                        <div class="title">${escapeHtml(item.title)}</div>
                        <div class="content">${escapeHtml(item.content)}</div>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) + '</div>';
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        loadNews();
    </script>
</body>
</html>
