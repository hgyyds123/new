<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 · hg</title>
    
    <!-- 字体与图标 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ================= 1. 浅色模式 ================= */
        :root {
            --bg-color: #F8F9FA;
            --surface: #FFFFFF;
            --surface-variant: #F0F4F9;
            --text-main: #1F1F1F;
            --text-sub: #444746;
            --outline: #747775;
            --outline-variant: #C4C7C5;
            
            --primary: #0b57d0;
            --on-primary: #FFFFFF;
            --primary-container: #d3e3fd;
            --on-primary-container: #041e49;
        }

        /* ================= 2. 深色模式 ================= */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #131314;
                --surface: #1E1F20;
                --surface-variant: #282A2C;
                --text-main: #E3E3E3;
                --text-sub: #C4C7C5;
                --outline: #8E918F;
                --outline-variant: #444746;
                
                --primary: #A8C7FA;
                --on-primary: #062E6F;
                --primary-container: #0842A0;
                --on-primary-container: #D3E3FD;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        a { text-decoration: none; color: inherit; }

        /* ================= 顶部导航栏 ================= */
        .top-app-bar {
            height: 64px; background-color: var(--bg-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; position: sticky; top: 0; z-index: 100;
        }
        .brand { font-size: 22px; font-weight: 500; color: var(--text-main); }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%;
            color: var(--text-sub); display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: var(--surface-variant); }

        /* ================= 主体内容 ================= */
        .container { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 48px 24px; }
        @media (max-width: 600px) { .container { padding: 24px 16px; } }

        .headline-large {
            font-size: 36px; font-weight: 400; line-height: 44px; margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px; color: var(--text-sub); margin-bottom: 48px;
        }

        /* ================= 时间轴列表 ================= */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 32px;
            position: relative;
        }

        /* 左侧竖线 */
        .timeline::before {
            content: '';
            position: absolute;
            top: 8px;
            bottom: 0;
            left: 7px;
            width: 2px;
            background-color: var(--outline-variant);
        }

        .log-entry {
            position: relative;
            padding-left: 32px;
        }

        /* 左侧圆点 */
        .log-entry::before {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--primary);
            border: 3px solid var(--bg-color);
            box-shadow: 0 0 0 1px var(--outline-variant);
        }

        /* 日期与版本号 */
        .log-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 12px;
        }
        .log-date { font-size: 14px; font-weight: 500; color: var(--primary); }
        .log-version { 
            font-size: 12px; font-weight: 500; 
            background-color: var(--surface-variant); 
            padding: 2px 8px; border-radius: 8px;
            color: var(--text-sub);
        }

        /* 更新条目 */
        .log-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-items li {
            font-size: 15px;
            color: var(--text-main);
            position: relative;
            padding-left: 20px;
        }

        /* 列表前的小圆点 */
        .log-items li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--outline);
        }

        /* 多行文本与图片适配 */
        .log-items li img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 12px;
            display: block;
            box-shadow: 0 1px 2px rgba(0,0,0,.08);
        }

        .loading, .empty {
            text-align: center; color: var(--text-sub); font-size: 15px; padding: 40px 0;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }

        .loading .material-symbols-outlined { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 顶部应用栏 -->
    <header class="top-app-bar">
        <a href="/" class="icon-btn m3-ripple">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="brand">hg</div>
        <div style="width: 40px;"></div> <!-- 占位保持居中 -->
    </header>

    <main class="container">
        
        <h1 class="headline-large">更新日志</h1>
        <p class="subtitle">hg 平台的变更记录</p>

        <div id="logContainer" class="timeline">
            <div class="loading">
                <span class="material-symbols-outlined">sync</span>
                正在加载...
            </div>
        </div>

    </main>

    <script>
        async function loadLog() {
            const container = document.getElementById("logContainer");
            try {
                const res = await fetch("./log.txt?t=" + Date.now());
                if (!res.ok) throw new Error("找不到 log.txt");
                const text = await res.text();

                const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));

                if (lines.length === 0) {
                    container.innerHTML = '<div class="empty">暂无更新记录</div>';
                    return;
                }

                // 按“日期|版本”分组
                const groups = {};
                const order = [];
                lines.forEach(line => {
                    const parts = line.split("|");
                    if (parts.length < 3) return;
                    const [date, version, ...rest] = parts;
                    const content = rest.join("|");
                    const key = date + "|" + version;
                    if (!groups[key]) {
                        groups[key] = { date, version, items: [] };
                        order.push(key);
                    }
                    groups[key].items.push(content);
                });

                // 倒序显示，最新的在最上面
                container.innerHTML = "";
                order.reverse().forEach(key => {
                    const g = groups[key];
                    const div = document.createElement("div");
                    div.className = "log-entry";
                    
                    // 生成列表项 HTML，如果是图片则不转义
                    const itemsHtml = g.items.map(item => {
                        const isImage = item.includes('<img ');
                        const content = isImage ? item : escapeHtml(item);
                        return `<li>${content}</li>`;
                    }).join("");

                    div.innerHTML = `
                        <div class="log-header">
                            <span class="log-date">${escapeHtml(g.date)}</span>
                            <span class="log-version">${escapeHtml(g.version)}</span>
                        </div>
                        <ul class="log-items">
                            ${itemsHtml}
                        </ul>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message)}</div>`;
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        loadLog();
    </script>
</body>
</html>
