<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线模式 · hg</title>
<style>
  body{font-family:Roboto,'Noto Sans SC',sans-serif;background:#F8F9FA;color:#1F1F1F;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
  .card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 12px rgba(0,0,0,.08);max-width:420px;width:100%}
  .icon{font-size:48px;color:#0b57d0;margin-bottom:12px}
  h1{font-size:22px;margin:0 0 8px}
  p{font-size:14px;color:#444746;margin:0 0 20px;line-height:1.6}
  .btn{background:#0b57d0;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer}
  .btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>当前处于离线模式</h1>
  <p>您尚未缓存此页面，或网络暂时不可用。请连接网络后重试。已缓存的页面可正常浏览。</p>
  <button class="btn" onclick="window.location.reload()">重新加载</button>
</div>
</body>
</html>
