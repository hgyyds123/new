<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免责声明 · hgt.l.cd</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 22px; color: #333; margin-bottom: 20px; text-align: center; }

        ol {
            padding-left: 20px;
            margin-bottom: 28px;
        }

        ol li {
            font-size: 14px;
            color: #555;
            line-height: 1.9;
            margin-bottom: 6px;
        }

        .btn {
            display: block;
            width: 100%;
            background: #667eea;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover { background: #5568d3; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>📋 免责声明</h1>
        <ol>
            <li>本聊天室仅面向群内成员，请勿对外传播链接。</li>
            <li>请勿发布违法、违规、色情、暴力、广告等内容。</li>
            <li>聊天记录会保存在服务器上，管理员有权查看。</li>
            <li>请文明发言，违者可能被禁止进入。</li>
            <li>继续使用即表示你已阅读并同意以上条款。</li>
        </ol>
        <button class="btn" id="agreeBtn">我已阅读并同意</button>
    </div>

    <script>
        document.getElementById("agreeBtn").addEventListener("click", function () {
            sessionStorage.setItem("disclaimer_ok", "yes");
            window.location.href = "/talkroom/";
        });
    </script>
</body>
</html>
